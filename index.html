<style>
  :root{
    --bg: #fff8f0;
    --card: #ffffff;
    --ink: #2a1a14;
    --ink-soft: #6b5147;
    --coral: #e0562f;
    --coral-dark: #b83f1e;
    --amber: #f0a439;
    --amber-dark: #cf8620;
    --teal: #2b7a72;
    --teal-dark: #1e5951;
    --sand: #f4e3c9;
    --line: #ecd9c3;
    --good: #2b7a4c;
    --bad: #c53d3d;
    --shadow: 0 4px 14px rgba(120, 70, 30, 0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app{max-width:560px;margin:0 auto;padding:16px 16px 90px;}

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 14px;
  }
  .topbar h1{
    font-size:19px;margin:0;font-weight:800;letter-spacing:-0.3px;
  }
  .topbar .badge{
    font-size:11px;font-weight:700;color:var(--teal-dark);
    background:#e2f1ee;border-radius:20px;padding:5px 10px;
  }
  .back-btn{
    background:none;border:none;color:var(--coral-dark);font-weight:700;
    font-size:15px;padding:8px 4px;cursor:pointer;display:flex;align-items:center;gap:4px;
  }

  /* Overview */
  .month-card{
    background: linear-gradient(135deg, var(--coral), var(--amber));
    border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;
    box-shadow: var(--shadow); color:#fff; position:relative; overflow:hidden;
  }
  .month-card.m2{background: linear-gradient(135deg, var(--teal), #4fa89c);}
  .month-card.m3{background: linear-gradient(135deg, #8a4fc7, #c2599f);}
  .month-card h2{margin:0 0 2px;font-size:17px;font-weight:800;}
  .month-card p.sub{margin:0 0 12px;font-size:12.5px;opacity:0.92;}
  .month-progress-track{
    background:rgba(255,255,255,0.35);border-radius:10px;height:8px;overflow:hidden;margin-bottom:4px;
  }
  .month-progress-fill{background:#fff;height:100%;border-radius:10px;transition:width .3s;}
  .month-progress-label{font-size:11px;opacity:0.9;font-weight:600;}

  .week-row{
    display:flex;align-items:center;gap:12px;
    background: var(--card); border-radius:14px; padding:12px 14px;
    margin-top:10px; box-shadow: 0 1px 0 rgba(0,0,0,0.03); cursor:pointer;
    border:1px solid rgba(255,255,255,0.5);
  }
  .week-row:active{transform:scale(0.98);}
  .week-num{
    width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.28);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    flex-shrink:0;
  }
  .week-info{flex:1;min-width:0;}
  .week-info .wt{font-weight:700;font-size:14.5px;color:var(--ink);}
  .week-info .ws{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .week-chip{
    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;
  }
  .chip-todo{background:var(--sand);color:var(--coral-dark);}
  .chip-progress{background:#fde3c2;color:var(--amber-dark);}
  .chip-done{background:#dcefe4;color:var(--good);}

  /* Week detail */
  .week-header{
    background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .week-header .eyebrow{font-size:11px;font-weight:700;color:var(--coral-dark);text-transform:uppercase;letter-spacing:0.5px;}
  .week-header h2{margin:4px 0 6px;font-size:19px;}
  .week-header p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.4;}

  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    flex:1;padding:10px 4px;text-align:center;border-radius:12px;border:none;
    font-weight:700;font-size:13px;cursor:pointer;background:var(--sand);color:var(--coral-dark);
  }
  .tab-btn.active{background:var(--coral);color:#fff;}

  /* Flashcards */
  .fc-progress{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;font-weight:600;}
  .flip-card{
    perspective:1200px; height:280px; margin-bottom:16px;
  }
  .flip-inner{
    position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;
  }
  .flip-inner.flipped{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;
    border-radius:18px;padding:22px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:var(--shadow);
  }
  .flip-front{background:linear-gradient(160deg, #fff, var(--sand));}
  .flip-back{background:linear-gradient(160deg, var(--teal), var(--teal-dark));color:#fff;transform:rotateY(180deg);}
  .flip-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:0.6;margin-bottom:10px;}
  .flip-back .flip-label{opacity:0.75;}
  .flip-text{font-size:16px;font-weight:600;line-height:1.45;}
  .flip-back .flip-text{font-size:14.5px;font-weight:500;}
  .flip-hint{position:absolute;bottom:14px;right:16px;font-size:11px;opacity:0.5;font-weight:600;}

  .fc-controls{display:flex;gap:10px;}
  .fc-btn{
    flex:1;padding:13px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer;
  }
  .fc-btn.review{background:#fbe0d9;color:var(--coral-dark);}
  .fc-btn.known{background:#dcefe4;color:var(--good);}
  .fc-nav{display:flex;justify-content:space-between;margin-top:10px;}
  .fc-nav button{background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:13px;padding:8px;cursor:pointer;}

  /* Quiz */
  .quiz-progress{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;font-weight:600;}
  .quiz-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .quiz-q{font-size:15.5px;font-weight:700;margin-bottom:14px;line-height:1.4;}
  .quiz-opt{
    display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14px;font-weight:600;
    color:var(--ink);cursor:pointer;
  }
  .quiz-opt.correct{background:#dcefe4;border-color:var(--good);color:var(--good);}
  .quiz-opt.wrong{background:#fbe1e1;border-color:var(--bad);color:var(--bad);}
  .quiz-opt.disabled{pointer-events:none;}
  .quiz-explain{
    background:#fff4e6;border-radius:12px;padding:12px 14px;font-size:13px;color:#6b4b1e;
    margin-top:6px;line-height:1.4;
  }
  .quiz-next{
    margin-top:14px;width:100%;padding:13px;border-radius:14px;border:none;
    background:var(--coral);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;
  }
  .quiz-result{text-align:center;padding:30px 16px;}
  .quiz-result .score{font-size:44px;font-weight:800;color:var(--coral-dark);}
  .quiz-result p{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .quiz-retry{
    margin-top:16px;padding:12px 22px;border-radius:14px;border:none;background:var(--sand);
    color:var(--coral-dark);font-weight:700;cursor:pointer;
  }

  /* Interview */
  .iv-card{
    background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);
    cursor:pointer;
  }
  .iv-q{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .iv-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;}
  .iv-check.on{background:var(--good);border-color:var(--good);color:#fff;}
  .iv-answer{
    margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:10px;display:none;
  }
  .iv-card.open .iv-answer{display:block;}

  .empty-hint{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------
   DATA
--------------------------------------------------------------- */
const WEEKS = [
{
  month:1, week:1,
  title:"STM32 Refresh — Registers & Memory-Mapped I/O",
  summary:"Bare-metal fundamentals: pointers, volatile, the Cortex-M memory map, and the interrupt vector table.",
  flashcards:[
    {q:"What does the `volatile` keyword tell the compiler, and why is it essential for memory-mapped I/O?", a:"It tells the compiler the value can change outside the normal flow of the program (e.g. hardware can change it), so the compiler must not cache it in a register or optimize the read/write away — it must re-read from memory every time."},
    {q:"What is memory-mapped I/O (MMIO)?", a:"A design where peripheral registers (GPIO, UART, timers...) are mapped into the same address space as RAM, so you access hardware by reading/writing to specific memory addresses instead of using special I/O instructions."},
    {q:"What is the Interrupt Vector Table (IVT) on a Cortex-M chip?", a:"An array of function pointers stored at the start of flash memory. Each entry is the address of the handler function for a specific interrupt/exception (reset, NMI, hard fault, peripheral IRQs, etc.). The core jumps to the matching address when that interrupt fires."},
    {q:"Why is a pointer to a peripheral register typically declared as `volatile uint32_t *`?", a:"`uint32_t` matches the register width, the pointer gives you the exact memory address of the register, and `volatile` prevents the compiler from optimizing away reads/writes since the value can change from hardware, not just from your code."},
    {q:"What's the difference between a pointer and the value it points to, in the context of `*(volatile uint32_t*)0x40020014 = 0x1;`?", a:"The number is a memory address (a register's location). Casting it to a pointer type and dereferencing it (`*`) lets you read/write directly to that address — here, writing 1 to set a bit in a GPIO register."},
    {q:"What happens on Cortex-M when the CPU receives an interrupt while executing normal code?", a:"The CPU automatically stacks (pushes) key registers, looks up the handler's address in the vector table, and jumps to it. When the handler returns, the CPU automatically unstacks the registers and resumes where it left off."},
    {q:"Why do you often need to enable a peripheral's clock (via RCC registers) before configuring it?", a:"On STM32, peripherals are clock-gated to save power — if the peripheral's clock isn't enabled in the RCC (Reset and Clock Control) registers, writes to its configuration registers may silently have no effect."},
    {q:"What is bit-banding / bitwise register manipulation used for, conceptually?", a:"Setting, clearing, toggling, or reading individual bits in a register without disturbing the other bits — typically via `|=` (set), `&= ~` (clear), `^=` (toggle), and `&` (read/test) with a bitmask."}
  ],
  quiz:[
    {q:"Without `volatile`, what's the most likely bug when polling a hardware status register in a loop?", options:["The code won't compile","The compiler may cache the register value in a CPU register and the loop never sees updates, becoming infinite or stale","The register address will be wrong","Nothing — volatile is only cosmetic"], correct:1, explain:"The compiler assumes memory it wrote itself doesn't change unless it writes it again. Without `volatile`, it may hoist the read out of the loop entirely, so your code polls a stale cached value forever."},
    {q:"What lives at the very beginning of the vector table on most Cortex-M chips?", options:["The reset handler address","The initial stack pointer value","A NOP instruction","The clock configuration"], correct:1, explain:"Entry 0 is the initial main stack pointer (MSP) value, entry 1 is the reset handler address — the CPU loads the SP from entry 0, then jumps to the address in entry 1."},
    {q:"You write to a GPIO configuration register but nothing happens on the pin. What's a common root cause?", options:["The pin is defective","The GPIO port's clock was never enabled in RCC","Volatile isn't needed for GPIO","The board needs to be power-cycled"], correct:1, explain:"A very common bare-metal gotcha: the peripheral clock gate wasn't enabled, so the register writes are effectively ignored by the (unclocked) peripheral."},
    {q:"Which operation clears bit 3 of a register without touching the other bits?", options:["reg |= (1 << 3)","reg &= ~(1 << 3)","reg ^= (1 << 3)","reg = (1 << 3)"], correct:1, explain:"AND-ing with the inverted mask clears only that bit; all other bits stay because they're AND-ed with 1."}
  ],
  interview:[
    {q:"Explain what `volatile` does and give a real bug you'd see without it.", a:"Talking points: compiler optimization assumptions, register caching, an infinite polling loop example, and why this is invisible in simulation but appears on real hardware."},
    {q:"Walk me through what happens electrically and in software from power-on reset to your `main()` running.", a:"Talking points: reset vector fetch, stack pointer init, startup code (`.data`/`.bss` init), then call to `main()` — shows you understand the boot sequence, not just application code."},
    {q:"What is a memory-mapped register, concretely, in terms of an address and a bit?", a:"Talking points: peripheral base address + offset = register address; each bit or bitfield controls a specific hardware function; give one real example (e.g. GPIO ODR bit sets a pin high)."},
    {q:"Why would a security engineer specifically care about the interrupt vector table?", a:"Talking points: it's a common attack/fault-injection target (redirecting execution), it must be protected/write-protected in secure designs, and it matters for secure boot chain-of-trust reasoning."}
  ]
},
{
  month:1, week:2,
  title:"Peripherals — SPI, I2C & Debugging",
  summary:"Serial peripheral protocols and using GDB to actually see what firmware is doing.",
  flashcards:[
    {q:"How many wires does a basic SPI bus use, and what are they?", a:"Typically 4: SCK (clock), MOSI (master out slave in), MISO (master in slave out), and SS/CS (chip/slave select, one per device)."},
    {q:"How many wires does I2C use, and what are they?", a:"2: SDA (data) and SCL (clock), both open-drain with pull-up resistors, shared by all devices on the bus."},
    {q:"How does I2C address multiple devices on just 2 wires?", a:"Each device has a unique 7-bit (or 10-bit) address. The master sends the address first; only the device matching that address responds — devices don't need separate select lines."},
    {q:"Why does SPI need a separate chip-select line per device, while I2C doesn't?", a:"SPI has no addressing scheme on the wire — the master selects which device is 'listening' physically via a dedicated CS line, whereas I2C uses in-band addressing so any number of devices can share the same two wires."},
    {q:"Name one advantage of SPI over I2C, and one advantage of I2C over SPI.", a:"SPI: much faster (often 10+ MHz vs I2C's typical 100k-1MHz), full duplex. I2C: fewer pins needed for many devices (2 wires regardless of device count), built-in addressing and ACK/NACK."},
    {q:"What's the difference between a breakpoint and a watchpoint in GDB?", a:"A breakpoint halts execution when the CPU reaches a specific line/address of code. A watchpoint halts execution when a specific memory location's value changes, regardless of which code touches it."},
    {q:"Why is a watchpoint especially useful for debugging memory-mapped I/O or shared-state bugs?", a:"It lets you catch exactly when and where a variable or register is unexpectedly modified, which is hard to find by single-stepping when many code paths could be responsible."},
    {q:"What does 'clock polarity and phase' (CPOL/CPHA) mean in SPI, in plain terms?", a:"They define when data is sampled relative to the clock edge (rising/falling) and what the clock's idle level is — master and slave must agree on the same mode (0-3) or communication fails."}
  ],
  quiz:[
    {q:"Two I2C devices on the same bus have the same fixed 7-bit address. What's the practical consequence?", options:["No problem, I2C handles duplicates automatically","They'll conflict — you can't address them individually without a mux, different address pins, or a different part", "SPI will resolve this automatically","I2C addresses are always unique by design"], correct:1, explain:"This is a classic real-world I2C headache — you need an address pin strap, an I2C mux/switch, or a different sensor variant to resolve address collisions."},
    {q:"Which bus is generally the better choice when you need the highest throughput to a single sensor (e.g. a fast IMU)?", options:["I2C, because it's simpler","SPI, because it's typically much faster and full-duplex","Both are identical in speed","Neither, use UART"], correct:1, explain:"SPI's dedicated lines and lack of addressing/ACK overhead let it run much faster than typical I2C speeds."},
    {q:"You set a watchpoint on a global variable and it triggers from an ISR you didn't expect. What does this tell you?", options:["GDB is malfunctioning","The variable is being modified from an interrupt context, a common source of race conditions", "Watchpoints don't work with interrupts","The variable is corrupted"], correct:1, explain:"This is exactly the kind of bug watchpoints are great at catching — shared state being touched from an ISR unexpectedly, a classic root cause of race conditions."},
    {q:"In SPI, what is the role of the CS (chip select) line during a transaction?", options:["It supplies power to the slave","It must be asserted (active) by the master to tell one specific slave to listen/respond","It carries the clock signal","It's optional and rarely used"], correct:1, explain:"CS tells a specific slave 'this transaction is for you' — without it (or with multiple slaves' CS asserted at once), you'd get bus contention."}
  ],
  interview:[
    {q:"Compare SPI and I2C and tell me which you'd choose for a given sensor and why.", a:"Talking points: pin count vs speed trade-off, addressing scheme, typical use cases (SPI for high-speed sensors/flash, I2C for many low-speed sensors on limited pins)."},
    {q:"Describe a real bug you debugged using GDB — breakpoints, watchpoints, or stepping through an ISR.", a:"Talking points: frame this as a story (STAR format) — what was the symptom, what tool feature found it, what was the root cause and fix."},
    {q:"How would you debug a race condition between an ISR and main-loop code?", a:"Talking points: watchpoints on shared variables, disabling interrupts to test for the symptom disappearing, understanding atomicity of reads/writes on your architecture."},
    {q:"What could cause an SPI transaction to return garbage data?", a:"Talking points: CPOL/CPHA mismatch, wrong clock speed, CS timing issues, wiring/floating lines, or a slave not actually ready."}
  ]
},
{
  month:1, week:3,
  title:"FreeRTOS — Tasks, Queues & Synchronization",
  summary:"Multitasking concepts: tasks, priorities, queues, mutexes, semaphores, and ISR-to-task handoff.",
  flashcards:[
    {q:"What is a FreeRTOS task?", a:"An independent thread of execution with its own stack and context, scheduled by the RTOS kernel based on priority and state (running, ready, blocked, suspended)."},
    {q:"What's the core difference between a mutex and a binary semaphore?", a:"A mutex protects a shared resource and has the concept of ownership (the task that locked it must unlock it) with priority inheritance to avoid priority inversion. A binary semaphore is a signaling mechanism between tasks/ISRs with no ownership concept — any task can 'give' or 'take' it."},
    {q:"What is priority inversion, and how does a mutex with priority inheritance help?", a:"Priority inversion happens when a high-priority task is blocked waiting on a resource held by a low-priority task, while a medium-priority task preempts the low-priority one — effectively making the high-priority task wait indefinitely. Priority inheritance temporarily boosts the low-priority task's priority to that of the waiting high-priority task so it finishes and releases the resource faster."},
    {q:"Why can't you safely call most FreeRTOS API functions directly inside an ISR?", a:"Regular API functions may block or aren't designed for interrupt context. FreeRTOS provides special 'FromISR' variants (e.g. `xQueueSendFromISR`) that are safe to call from interrupts and never block."},
    {q:"What's a typical pattern for handing data from an ISR to a task?", a:"The ISR does minimal work and calls a `...FromISR` function (e.g. `xQueueSendFromISR` or `xSemaphoreGiveFromISR`) to pass data or signal a waiting task, then a `portYIELD_FROM_ISR()` triggers a context switch if a higher-priority task was unblocked."},
    {q:"What is a FreeRTOS queue used for?", a:"Passing data (by copy) between tasks, or between an ISR and a task, in a thread-safe FIFO manner — the receiving task can block until data is available."},
    {q:"What does 'blocking' vs 'polling' mean in an RTOS context?", a:"Polling repeatedly checks a condition in a loop, wasting CPU cycles. Blocking puts the task into a 'waiting' state (consuming no CPU) until the awaited event (queue data, semaphore, timeout) occurs, letting the scheduler run other tasks meanwhile."},
    {q:"Why might polling still be justified in an embedded system despite blocking being 'better'?", a:"For very short, time-critical waits where the overhead of a context switch is higher than the wait itself, or in the ISR itself where you can't block at all."}
  ],
  quiz:[
    {q:"A high-priority task appears to stall while a low-priority task holds a resource, and a medium-priority task keeps running. What's this called?", options:["Deadlock","Priority inversion","Starvation by design","Stack overflow"], correct:1, explain:"This is the textbook definition of priority inversion — the medium task is effectively blocking the high-priority task indirectly."},
    {q:"Which is the correct tool to protect a shared resource (like a sensor data buffer) accessed by two tasks?", options:["A queue","A mutex","A software timer","A binary semaphore"], correct:1, explain:"Mutexes are specifically designed for mutual exclusion on shared resources and include priority inheritance; semaphores are better suited for signaling events, not resource protection."},
    {q:"An ISR needs to wake up a task waiting for sensor data. What's the correct approach?", options:["Call the normal blocking queue-send function","Call the ISR-safe variant (e.g. xQueueSendFromISR) and yield if needed","Directly call the task's function from the ISR","Busy-wait inside the ISR until the task processes it"], correct:1, explain:"Only the 'FromISR' API variants are safe in interrupt context; they never block and typically request a context switch via a yield flag."},
    {q:"What's the main problem with a task that polls a flag in a tight `while` loop instead of blocking on a semaphore?", options:["It's more readable","It wastes CPU time that could go to other tasks, and may starve lower-priority tasks", "It's actually faster and preferred","Polling doesn't work in FreeRTOS"], correct:1, explain:"Polling burns CPU cycles the scheduler could give to other ready tasks — blocking lets the CPU do useful work (or sleep) while waiting."}
  ],
  interview:[
    {q:"Explain the difference between a task and an interrupt.", a:"Talking points: interrupts preempt everything and run ASAP with minimal work; tasks are scheduled by priority and can block/yield; ISRs should be short and hand off real work to a task."},
    {q:"Explain mutex vs semaphore, out loud, with a concrete example of each.", a:"Talking points: mutex = protecting a shared sensor buffer between two tasks; semaphore = ISR signaling a task that new data arrived. Mention ownership and priority inheritance as the key differentiator."},
    {q:"Describe priority inversion and how you'd diagnose it in a real system.", a:"Talking points: symptom (high-priority task missing deadlines), root cause investigation (task priorities, resource holding), and the fix (mutex with priority inheritance, or redesigning resource sharing)."},
    {q:"Walk me through how you restructured a polling design into an ISR→queue→task pipeline.", a:"Talking points: reference your Week 2→3 project checkpoint — before/after architecture, why it's more efficient and scalable."},
    {q:"What happens if you call a blocking FreeRTOS function from inside an ISR?", a:"Talking points: undefined/incorrect behavior, potential crash or corruption — explain why ISR-safe API variants exist and when you'd use `portYIELD_FROM_ISR`."}
  ]
},
{
  month:1, week:4,
  title:"STM32↔ESP32 Bridge & MQTT",
  summary:"UART bridging between MCU and network co-processor, and the MQTT publish/subscribe model.",
  flashcards:[
    {q:"In this project's architecture, why does the ESP32 act as a 'network co-processor' rather than doing the sensor/crypto work itself?", a:"It mirrors a real industry pattern (a secure MCU/element handling sensitive logic + a separate connectivity chip). It also lets the STM32 (bare-metal, more controllable/secure) own the sensitive work while reusing existing ESP32 Wi-Fi/MQTT/OTA experience for connectivity."},
    {q:"What is MQTT, at a high level?", a:"A lightweight publish/subscribe messaging protocol over TCP, designed for constrained devices and unreliable networks — clients publish messages to 'topics', and other clients subscribe to topics to receive them, all routed through a broker."},
    {q:"What is the role of the MQTT broker?", a:"It's the central server that receives all published messages and routes them to every client subscribed to the matching topic — publishers and subscribers never talk to each other directly."},
    {q:"Why is UART a sensible choice for STM32↔ESP32 communication on a dev board?", a:"It's simple (2 wires), doesn't require complex protocol stacks, is well supported by both chips' peripherals, and is fast enough for periodic sensor payloads."},
    {q:"In the pub/sub model, what decouples publishers from subscribers?", a:"The topic and the broker — a publisher doesn't need to know who (if anyone) is subscribed, and a subscriber doesn't need to know who published; they only need to agree on the topic name."},
    {q:"What is QoS (Quality of Service) in MQTT, conceptually?", a:"A setting (0, 1, or 2) defining delivery guarantees: 0 = at most once (fire and forget), 1 = at least once (may duplicate), 2 = exactly once (highest overhead) — chosen based on how critical it is that a message arrives and arrives only once."},
    {q:"Why might you design the UART protocol between STM32 and ESP32 to include a simple framing scheme (e.g. start byte, length, checksum)?", a:"UART has no built-in message boundaries — framing lets the receiver reliably detect where a message starts/ends and verify it wasn't corrupted, rather than assuming byte-perfect delivery."}
  ],
  quiz:[
    {q:"Why doesn't the MQTT publisher need to know which clients are subscribed to a topic?", options:["It always broadcasts to everyone regardless of topics","The broker handles routing based on topic subscriptions, decoupling publishers from subscribers","MQTT doesn't support subscriptions","Subscribers must poll the publisher directly"], correct:1, explain:"This decoupling is the whole point of the pub/sub pattern — it's what makes MQTT scalable for many IoT devices."},
    {q:"In this project's design, what is the ESP32 explicitly NOT supposed to have access to (once encryption is added in Month 2)?", options:["The Wi-Fi credentials","The plaintext sensor data or the encryption keys","The MQTT broker address","The UART baud rate"], correct:1, explain:"The design goal is that the ESP32 only forwards ciphertext — it never sees plaintext or keys, which is a deliberate security boundary worth highlighting in interviews."},
    {q:"Why add a simple framing/checksum scheme over raw UART bytes?", options:["UART requires it to physically function","To let the receiver detect message boundaries and corrupted data reliably","It makes the code shorter","Framing is only needed for I2C"], correct:1, explain:"UART is just a byte stream with no built-in structure — framing and checksums are how you build reliability on top of it."},
    {q:"Which MQTT QoS level guarantees a message is delivered exactly once (at the cost of overhead)?", options:["QoS 0","QoS 1","QoS 2","There is no such guarantee in MQTT"], correct:2, explain:"QoS 2 uses a 4-way handshake to guarantee exactly-once delivery, at the cost of more round trips than QoS 0 or 1."}
  ],
  interview:[
    {q:"Walk me through your end-to-end pipeline: sensor → STM32 → UART → ESP32 → MQTT → Python.", a:"Talking points: describe each hop, why each design choice was made, and what would break if one link failed (e.g. UART framing, Wi-Fi drop, broker unavailable)."},
    {q:"Why split responsibilities between STM32 and ESP32 instead of using one chip for everything?", a:"Talking points: separation of concerns, security boundary (sensitive logic isolated from the network-facing chip), reuse of prior ESP32 experience, and this being a realistic industry pattern (MCU + connectivity chip / secure element)."},
    {q:"What would you do if the UART link between the two chips were untrusted (e.g. an attacker with board access)?", a:"Talking points: this foreshadows Month 2 — payload-level encryption on the STM32 side means even a compromised or sniffed UART/ESP32 doesn't expose plaintext."},
    {q:"Explain publish/subscribe vs a direct client-server model, and why MQTT chose pub/sub for IoT.", a:"Talking points: decoupling, one-to-many fan-out, broker as a single point handling many constrained clients, favoring low overhead over TCP."}
  ]
},
{
  month:2, week:5,
  title:"mbedTLS on STM32 — ChaCha20-Poly1305",
  summary:"Getting a crypto library running on constrained hardware, and applying your thesis cipher.",
  flashcards:[
    {q:"Why is 'footprint/config tuning' a real, non-trivial skill when porting mbedTLS to an MCU?", a:"Full-featured mbedTLS is far too large (flash/RAM) for many MCUs. You must selectively enable only the modules/algorithms you actually need via config macros, which requires understanding dependencies between mbedTLS modules and the trade-offs of removing features."},
    {q:"What are the two things ChaCha20-Poly1305 provides together, and why does that matter?", a:"Confidentiality (ChaCha20 stream cipher encrypts the data) and integrity/authenticity (Poly1305 MAC detects tampering) — together they form an AEAD (Authenticated Encryption with Associated Data) construction, so an attacker can't read the data or silently modify it."},
    {q:"What is a nonce in the context of ChaCha20-Poly1305, and why must it never repeat with the same key?", a:"A nonce is a unique value used once per encryption operation with a given key. Reusing a nonce with the same key breaks ChaCha20's keystream uniqueness, allowing an attacker to recover plaintext via XOR of two ciphertexts and potentially forge the MAC — a critical, catastrophic failure."},
    {q:"What is 'associated data' (the AD in AEAD) used for?", a:"Data that is authenticated (integrity-protected) but not encrypted — e.g. a message header or sequence number. It ensures that data can't be tampered with even though it's sent in the clear."},
    {q:"Why is ChaCha20 often preferred over AES on microcontrollers without hardware AES acceleration?", a:"ChaCha20 is designed for fast, constant-time performance in pure software using only additions, rotations, and XORs — no lookup tables (which also avoids cache-timing side channels) — whereas software AES is slower and can be vulnerable to timing attacks without hardware support."},
    {q:"What does 'constant-time' mean in a crypto implementation, and why does it matter?", a:"An implementation whose execution time doesn't depend on secret data (key/plaintext values) — this matters because timing differences can leak secret information to an attacker measuring execution time (a side-channel attack)."},
    {q:"What is a key generation / key management concern you must handle even before encrypting your first payload?", a:"Where the key comes from (securely generated, provisioned, or derived), where it's stored (ideally not in plain flash), and how it's protected from extraction — key management is often harder than the crypto algorithm itself."}
  ],
  quiz:[
    {q:"Why can't you just enable 'all of mbedTLS' by default on a small STM32?", options:["mbedTLS doesn't support STM32","Flash/RAM constraints require selectively configuring only needed modules","It's a licensing issue","mbedTLS requires an OS"], correct:1, explain:"Full mbedTLS is large; embedded config tuning (selecting only needed algorithms/modules) is essential and a real, demonstrable skill."},
    {q:"What happens if you accidentally reuse the same nonce with the same key in ChaCha20-Poly1305?", options:["Nothing, nonces are optional","A minor performance hit","A critical security failure — plaintext and/or the MAC can potentially be recovered/forged","The library will silently generate a new one"], correct:2, explain:"Nonce reuse is one of the most catastrophic mistakes possible in stream-cipher-based AEAD — it must be prevented by design (counter, random-per-message, etc.)."},
    {q:"What does Poly1305 add on top of what ChaCha20 alone provides?", options:["Faster encryption","Integrity/authenticity (tamper detection) via a MAC","Key exchange","Compression"], correct:1, explain:"ChaCha20 alone only gives confidentiality; Poly1305 adds the authentication tag so tampering is detectable — together they're AEAD."},
    {q:"Why might ChaCha20 be a better fit than software AES on a small MCU without a crypto accelerator?", options:["ChaCha20 is legally required for IoT","ChaCha20 is fast in pure software and avoids lookup-table timing side channels, unlike naive software AES","AES cannot run on any microcontroller","ChaCha20 uses less memory for keys"], correct:1, explain:"This is exactly why ChaCha20 was designed the way it was — fast and constant-time without hardware support, unlike table-based AES implementations."}
  ],
  interview:[
    {q:"Explain your thesis work: what does ChaCha20-Poly1305 do and why did you implement it in hardware/Verilog?", a:"Talking points: describe the algorithm at a level beyond 'I implemented it' — stream cipher + MAC = AEAD, why AEAD matters, and what a Verilog/RTL implementation adds (throughput, low power, deterministic timing) versus software."},
    {q:"Why AEAD (confidentiality + integrity together) instead of encryption alone?", a:"Talking points: encryption-only leaves data forgeable/tamperable even if unreadable; give a concrete example (an attacker flipping bits in ciphertext without a MAC to detect it)."},
    {q:"AES vs ChaCha20-Poly1305 — what are the real trade-offs?", a:"Talking points: hardware-accelerated AES (AES-NI, MCU crypto engines) is often faster with acceleration; ChaCha20 wins in pure software / no-acceleration contexts and has simpler constant-time properties; both are considered secure at the algorithm level today."},
    {q:"What's the danger of nonce reuse, and how would you engineer your firmware to prevent it?", a:"Talking points: explain the cryptographic failure mode, then a concrete mitigation (monotonic counter stored/incremented safely, avoiding resets that could replay a counter, etc.)."},
    {q:"Why is embedded crypto library configuration/tuning a real skill worth mentioning in an interview?", a:"Talking points: shows you understand resource-constrained trade-offs, not just 'calling a crypto function' — a common differentiator between application-level and embedded security engineers."}
  ]
},
{
  month:2, week:6,
  title:"Encrypting the Payload",
  summary:"STM32 encrypts before sending; ESP32 forwards ciphertext blind; verifying it's really encrypted.",
  flashcards:[
    {q:"Why is it a meaningful security property that 'the ESP32 never sees plaintext or keys'?", a:"It limits the impact of an ESP32 compromise (a common attack surface since it's Wi-Fi-connected and runs more complex/less trusted code) — even if attacked, the sensitive data and keys are never exposed there, because encryption/decryption only happens on the STM32/Python endpoints."},
    {q:"What's the practical difference between 'claiming' data is encrypted and 'proving' it with Wireshark?", a:"Wireshark lets you capture the actual bytes on the wire and visually/statistically confirm they look like random ciphertext (no readable patterns, high entropy) rather than just trusting that your code called an encrypt function correctly."},
    {q:"What should captured ciphertext look like in a packet capture if encryption is working correctly?", a:"High-entropy, effectively random-looking bytes with no discernible patterns or repeated structures — no readable ASCII, no obvious correlation between similar plaintext inputs."},
    {q:"Why encrypt at the payload/application layer at all, if you're also going to add TLS later (Week 7)?", a:"Payload-level encryption protects the data end-to-end between the actual sender and receiver (STM32↔Python), independent of any intermediate hop — TLS alone would only protect data in transit and could still expose plaintext to anything terminating the TLS connection (like a broker or an intermediate device)."},
    {q:"What's a risk if the encryption key is hardcoded identically into every device in a product line?", a:"A single key compromise (extracted from one device) compromises every device using that key — proper key management usually requires per-device unique keys or secure provisioning, not a shared hardcoded secret."}
  ],
  quiz:[
    {q:"You capture the ESP32→broker traffic in Wireshark. What confirms encryption is actually working, not just present in code?", options:["The packet size is small","The payload bytes appear random/high-entropy with no visible structure or plaintext", "The MQTT topic name is hidden","The IP addresses are encrypted"], correct:1, explain:"Visually/statistically confirming ciphertext looks random (vs. spotting your sensor data in plaintext) is the concrete proof interviewers like to hear you demonstrate, not just describe."},
    {q:"Why does keeping keys off the ESP32 meaningfully reduce risk in this architecture?", options:["It doesn't, ESP32 is equally trusted","It limits the blast radius if the Wi-Fi-connected chip (larger attack surface) is compromised","ESP32 can't store data","It only matters for performance"], correct:1, explain:"Security architecture is partly about limiting what a compromise of any one component exposes — this is a textbook example of that principle applied to a two-chip design."},
    {q:"If you rely only on TLS (Week 7) and skip payload encryption, what's a gap that remains?", options:["No gap, TLS is sufficient always","Anything that terminates the TLS connection (e.g. the broker) could see plaintext","TLS is weaker than payload encryption in every case","MQTT doesn't support TLS"], correct:1, explain:"TLS protects data in transit to whatever terminates the connection — if that's a broker you don't fully trust or that could be compromised, plaintext is exposed there without payload-level (end-to-end) encryption."}
  ],
  interview:[
    {q:"How did you verify your data was actually encrypted, not just that your code called an encrypt function?", a:"Talking points: Wireshark capture, before/after comparison, describing what random ciphertext looks like vs. structured plaintext."},
    {q:"Why keep the ESP32 blind to plaintext and keys — what does this defend against specifically?", a:"Talking points: reduced attack surface, compromise containment, real-world parallel to secure element / MCU separation designs used in industry."},
    {q:"Explain the difference between payload-level (end-to-end) encryption and transport-level (TLS) encryption.", a:"Talking points: what each protects, where each terminates, and why using both gives defense in depth rather than being redundant."},
    {q:"What key management weaknesses would you flag in a v1 prototype like this, and how would you fix them for production?", a:"Talking points: hardcoded/shared keys, no secure key storage, no rotation — mention concepts like per-device provisioning, secure elements, or key derivation as the 'next step' answer."}
  ]
},
{
  month:2, week:7,
  title:"TLS for the Transport Layer",
  summary:"MQTT over TLS, certificates, and why dual-layer encryption (payload + transport) matters.",
  flashcards:[
    {q:"What does TLS add on top of a plain TCP connection, at a high level?", a:"Encryption of all data in transit, integrity protection, and authentication of at least the server (and optionally the client) via certificates — preventing eavesdropping and tampering on the network path."},
    {q:"What is the basic purpose of a certificate in TLS?", a:"It cryptographically binds an identity (e.g. a server's hostname) to a public key, signed by a trusted Certificate Authority (CA), so a client can verify it's really talking to the server it intended to."},
    {q:"What's the difference between server authentication and mutual (client+server) authentication in TLS?", a:"Server authentication: only the client verifies the server's certificate (the common web case). Mutual TLS (mTLS): the server also requires and verifies a client certificate, so both sides prove their identity — common in IoT/M2M for stronger device authentication."},
    {q:"Why might mutual TLS be especially relevant for an IoT device connecting to an MQTT broker?", a:"It ensures the broker only accepts connections from devices holding a valid, provisioned client certificate — preventing rogue or spoofed devices from connecting, not just protecting the data in transit."},
    {q:"What are the two layers of protection in this project by the end of Week 7?", a:"1) Payload-level AEAD encryption (ChaCha20-Poly1305) applied on the STM32 before the data ever leaves the device. 2) Transport-level TLS encryption protecting the ESP32↔broker connection."},
    {q:"Why isn't 'just use TLS' always a sufficient answer for IoT security?", a:"TLS protects the pipe, not the endpoints — if the broker or any intermediate service is compromised, or if you need protection against a component (like the ESP32) itself, TLS alone doesn't cover those scenarios; hence defense-in-depth with payload encryption too."}
  ],
  quiz:[
    {q:"Why would you want both payload-level AEAD and transport-level TLS instead of picking just one?", options:["Redundancy is wasteful, one is always enough","They protect different things — payload encryption is end-to-end regardless of intermediaries, TLS protects the network path but trusts whatever terminates it","TLS alone can't encrypt MQTT","AEAD replaces the need for TLS entirely"], correct:1, explain:"This is a classic defense-in-depth interview answer — each layer covers a different threat model, and together they're stronger than either alone."},
    {q:"In mutual TLS (mTLS), what does the server require from the client that it doesn't in standard TLS?", options:["A password","A valid client certificate proving the client's identity","A larger TCP window","Nothing extra"], correct:1, explain:"mTLS adds client-side certificate authentication on top of the standard server authentication, useful for verifying device identity in IoT/M2M scenarios."},
    {q:"What does a CA-signed certificate actually prove to a connecting client?", options:["That the server has fast hardware","That a trusted third party has verified the binding between an identity and a public key","That the data will be compressed","That the server is using the latest TLS version"], correct:1, explain:"The CA's signature is what lets a client trust the identity claim in the certificate without having verified it directly itself."}
  ],
  interview:[
    {q:"Explain why you'd want both payload-level AEAD and transport-level TLS, not just one.", a:"Talking points: different threat models covered (end-to-end vs. network path), defense in depth, and a concrete scenario where one layer alone would fail but both together succeed."},
    {q:"What is mutual TLS and when would you use it for an IoT device?", a:"Talking points: device identity/authentication at the broker, preventing rogue devices, provisioning challenges (cert distribution) as the trade-off."},
    {q:"Walk me through what a certificate actually proves and doesn't prove.", a:"Talking points: it proves identity binding to a public key via a trusted CA signature; it does NOT prove the server/device is secure, uncompromised, or behaving correctly."},
    {q:"If you had to drop one security layer due to a hardware/performance budget, which would you keep and why?", a:"Talking points: there's no single right answer — show engineering judgment by reasoning about the specific threat model, e.g. keeping payload encryption if the broker itself is the bigger risk, or TLS if network eavesdropping is the primary concern."}
  ]
},
{
  month:2, week:8,
  title:"Threat Model & Write-Up",
  summary:"What does this pipeline actually protect against, and what's still exposed?",
  flashcards:[
    {q:"What is a threat model, in plain terms?", a:"A structured analysis of: what assets you're protecting, who might attack them and why, what attack paths exist, and which of those are mitigated vs. still exposed by your current design."},
    {q:"Name three assets worth protecting in this IoT pipeline.", a:"Examples: the sensor data itself (confidentiality), the encryption keys, the firmware image/integrity, device identity/authenticity, and availability of the sensing function."},
    {q:"Give an example of an attack this pipeline (as of Week 7) does NOT yet protect against.", a:"Physical attacks on the STM32 itself (e.g. reading keys via debug port/JTAG if not locked down), firmware tampering before secure boot is added (Month 3), or a fully compromised endpoint (STM32 or Python app) since encryption doesn't protect against a broken endpoint."},
    {q:"Why is 'what would a real product need beyond this' an important question to answer honestly?", a:"It demonstrates engineering maturity — showing you understand the difference between a portfolio prototype and a production-grade secure system, which interviewers specifically look for over blind confidence."},
    {q:"What's the difference between confidentiality, integrity, and availability (the CIA triad) as applied to this project?", a:"Confidentiality: sensor data can't be read by eavesdroppers (ChaCha20-Poly1305/TLS). Integrity: data/firmware can't be tampered with undetected (Poly1305 MAC, and secure boot signatures in Month 3). Availability: the system keeps functioning (not yet a focus of this project — e.g. no DoS protection)."}
  ],
  quiz:[
    {q:"As of the end of Month 2 (before secure boot), what's a realistic remaining gap in this pipeline?", options:["Data is not encrypted at all","Firmware integrity isn't verified yet — a tampered firmware image could still run", "MQTT doesn't work","The ESP32 can decrypt payloads"], correct:1, explain:"This is exactly why Month 3 exists — encryption alone doesn't stop someone from flashing malicious firmware onto the device; that's a firmware integrity problem, addressed by secure boot."},
    {q:"Which part of the CIA triad does a MAC (like Poly1305) primarily provide?", options:["Confidentiality","Integrity","Availability","None of the above"], correct:1, explain:"A MAC detects tampering (integrity); confidentiality comes from the encryption (ChaCha20) part of the AEAD construction."},
    {q:"Why is 'we protect against everything' a red flag answer in a security interview?", options:["It's actually the ideal answer","No real system protects against every threat; showing awareness of remaining gaps demonstrates maturity and honesty","Interviewers prefer overconfidence","It shows deep technical knowledge"], correct:1, explain:"Interviewers specifically probe for this — a candidate who can articulate what's NOT covered shows more real understanding than one who claims total coverage."}
  ],
  interview:[
    {q:"Present your threat model: what assets, what attackers, what's mitigated, what's still exposed.", a:"Talking points: structure this clearly — assets (data, keys, firmware, identity), plausible attackers (network eavesdropper, physical access, rogue device), and an honest gap list."},
    {q:"What would you add if this had a real budget and needed to ship as a product?", a:"Talking points: secure element for key storage, hardware root of trust, per-device provisioning, monitoring/logging, DoS resilience, and possibly independent security review/pentest."},
    {q:"Explain confidentiality, integrity, and availability, and map each to a specific defense in your project.", a:"Talking points: give concrete component-to-property mapping rather than a textbook definition — shows applied understanding, not memorization."},
    {q:"What's a threat this project explicitly does NOT try to solve, and why was that an acceptable scope decision?", a:"Talking points: e.g. side-channel/physical attacks, full DoS resilience — explain scope trade-offs as a deliberate, reasoned engineering decision, not an oversight."}
  ]
},
{
  month:3, week:9,
  title:"Secure Boot — Root of Trust & Signatures",
  summary:"How a device verifies its own firmware is legitimate before running it.",
  flashcards:[
    {q:"What is a 'root of trust' in secure boot?", a:"The foundational, immutable piece of the system (often stored in immutable/write-protected memory) that is implicitly trusted without further verification — everything else in the boot chain is verified against it, directly or transitively."},
    {q:"What is a chain of trust?", a:"A sequence where each stage of boot verifies the signature of the next stage before executing it, starting from the root of trust — so trust in the immutable first stage extends step-by-step to the final application firmware."},
    {q:"At a high level, how does signature verification work in secure boot?", a:"The firmware image is signed offline with a private key (kept secret by the manufacturer). The device stores/trusts the corresponding public key and, before executing new firmware, recomputes a hash of the image and verifies the signature against that public key — only a genuinely signed image passes."},
    {q:"Why must the public key (or its hash) used for verification be stored somewhere immutable/protected on the device?", a:"If an attacker could overwrite the trusted public key, they could simply substitute their own key pair and sign malicious firmware that would then 'verify' successfully — breaking the entire chain of trust."},
    {q:"What is PKI (Public Key Infrastructure) providing, conceptually, in this context?", a:"A system of key pairs, certificates, and (often) certificate authorities that manages trust relationships — who is allowed to sign what, and how a verifier confirms a signature was made by an authorized signer."},
    {q:"Why is a hash function used before signing, rather than signing the entire firmware image directly?", a:"Signing algorithms (like RSA or ECDSA) operate on small fixed-size inputs; hashing the (potentially large) firmware image to a fixed-size digest first makes signing/verification efficient while the hash's collision resistance ensures any change to the firmware changes the hash (and thus fails verification)."}
  ],
  quiz:[
    {q:"Why must the root of trust be immutable (e.g. burned into ROM or write-protected)?", options:["For performance reasons only","Because if it could be modified, an attacker could replace it and break the entire chain of trust","It's a legal/regulatory requirement only","It doesn't need to be immutable"], correct:1, explain:"The whole security model depends on there being something an attacker categorically cannot alter — that's the actual definition of a root of trust."},
    {q:"What happens in secure boot if the firmware's computed hash doesn't match what the signature attests to?", options:["The firmware runs anyway with a warning","Boot is halted / the firmware is rejected before execution","The device automatically re-downloads firmware","The hash mismatch is ignored for backward compatibility"], correct:1, explain:"Rejecting execution on verification failure is the entire point — an attacker's tampered image must never be allowed to run."},
    {q:"Why hash the firmware before signing rather than signing the raw image directly?", options:["Hashing makes the firmware smaller","Signing algorithms work on small fixed-size inputs, and hashing efficiently 'fingerprints' any change to the image","Hashing encrypts the firmware","It's not necessary, this is a common misconception"], correct:1, explain:"This combination (hash + sign) is standard practice — it's efficient and any single-bit change to firmware changes the hash, which then fails signature verification."}
  ],
  interview:[
    {q:"Explain how secure boot works, from power-on to running verified application code.", a:"Talking points: root of trust in immutable memory, bootloader stage(s), signature verification of each subsequent stage, chain of trust, and what happens on verification failure."},
    {q:"What's the difference between a root of trust and a chain of trust?", a:"Talking points: root of trust = the one immutable trust anchor; chain of trust = the sequence of verifications extending that trust to every subsequent stage."},
    {q:"Why can't you just check a firmware checksum instead of a cryptographic signature?", a:"Talking points: a plain checksum (like CRC) only detects accidental corruption, not deliberate tampering — an attacker can trivially recompute a checksum for their malicious image; a signature requires the attacker to possess the private key, which they don't."},
    {q:"What's a practical attack against a secure boot implementation that has a bug, and how would you defend against it?", a:"Talking points: e.g. fault injection to skip the verification check, or a public key that's mutable — connects forward to Week 11's 'attack your own device' exercise."}
  ]
},
{
  month:3, week:10,
  title:"Secure OTA — Signed Updates & Anti-Rollback",
  summary:"Turning OTA experience into a security portfolio piece: signed images, version checks.",
  flashcards:[
    {q:"Why is 'signed firmware image' not enough on its own — why also need an anti-rollback / version check?", a:"Without a version check, an attacker could replay an old, legitimately-signed firmware image that has a known vulnerability (already patched in a newer version) — the signature alone doesn't prevent installing valid-but-outdated firmware."},
    {q:"How does an anti-rollback mechanism typically work?", a:"The device stores a monotonically increasing version counter (often in one-time-programmable or protected non-volatile memory). Before accepting a new OTA image, the device checks the image's version is greater than (or equal to, depending on policy) the stored counter, and rejects downgrades."},
    {q:"What three OTA update outcomes should you be able to demonstrate to prove your implementation works?", a:"1) A validly signed, current-version firmware image is accepted. 2) A tampered firmware image (signature won't verify) is rejected. 3) A validly signed but old/rolled-back version is rejected by the anti-rollback check."},
    {q:"Why is storing the anti-rollback counter in ordinary, rewritable flash risky?", a:"An attacker with write access to that flash region could simply reset the counter back down, defeating the anti-rollback protection entirely — hence needing protected or monotonic-only storage (e.g. OTP fuses or a dedicated secure counter)."},
    {q:"What turns 'I did OTA once' into a security portfolio piece, specifically?", a:"Adding signature verification and anti-rollback on top of basic OTA — demonstrating you understand OTA not just as a connectivity/update feature, but as a security-critical trust boundary that must resist malicious or replayed firmware."}
  ],
  quiz:[
    {q:"An attacker has a legitimate, correctly-signed but older firmware image with a known vulnerability. What stops them from installing it?", options:["Signature verification alone","Anti-rollback / version checking","Nothing, this is unavoidable","TLS on the OTA download connection"], correct:1, explain:"This is precisely the gap that anti-rollback closes — a valid signature only proves authenticity, not that the version is acceptable/current."},
    {q:"Why is storing the rollback counter in normal writable flash a weak design?", options:["Flash is too slow","An attacker with flash write access could simply reset the counter, defeating the protection","Flash doesn't support counters","It's actually the recommended approach"], correct:1, explain:"The counter itself needs tamper resistance (e.g. one-time-programmable storage) or the whole anti-rollback mechanism can be trivially bypassed."},
    {q:"What are the three demonstrable outcomes a good secure OTA test suite should show?", options:["Fast, medium, and slow update speeds","Valid firmware accepted, tampered firmware rejected, and rolled-back version rejected","Only that valid firmware is accepted","Wi-Fi connected, disconnected, and reconnecting states"], correct:1, explain:"These three cases together prove both the signature verification and the anti-rollback mechanisms actually function, not just exist in code."}
  ],
  interview:[
    {q:"Walk me through your secure OTA implementation and how it builds on your STMicroelectronics internship OTA experience.", a:"Talking points: contrast prior OTA (functional update mechanism) with this version (security-critical trust boundary) — signature verification, anti-rollback, and why each matters."},
    {q:"What's the difference between signature verification and anti-rollback protection, and why do you need both?", a:"Talking points: signature = authenticity/integrity of THIS image; anti-rollback = preventing a valid-but-outdated (vulnerable) image from being reinstalled — two different threats, two different defenses."},
    {q:"How would an attacker try to defeat your OTA security, and how does your design prevent it?", a:"Talking points: tampering (caught by signature check), replay of old firmware (caught by anti-rollback), and rollback-counter tampering (caught by protected/OTP storage) — show you've reasoned through the attacker's options."},
    {q:"What would you add to make this OTA design production-grade?", a:"Talking points: A/B partition schemes for safe fallback, encrypted OTA images (not just signed), staged/canary rollouts, and secure element-backed key storage."}
  ]
},
{
  month:3, week:11,
  title:"Attack Your Own Device",
  summary:"Light offensive testing: replay, tampering, and traffic sniffing before/after encryption.",
  flashcards:[
    {q:"What is a replay attack, and how would you test for it on your MQTT pipeline?", a:"An attacker captures a legitimate, previously-sent message and resends it later to trick the system into accepting it again. You'd test by capturing a real MQTT publish, then resending the exact same captured bytes later and checking whether the system accepts it as if it were new/valid."},
    {q:"Why is the ability to demonstrate 'before/after' traffic sniffing (Week 6 vs. earlier) a strong portfolio artifact?", a:"It gives concrete, visual proof of the security improvement — showing readable plaintext before encryption and random-looking ciphertext after is far more convincing than a written claim, and shows you understand how to validate your own security claims."},
    {q:"What does it mean to 'tamper with a firmware image' as a self-test, and what should happen?", a:"Deliberately modifying bytes in a signed firmware image (simulating an attacker) and attempting to load it — a correct secure boot implementation should detect the signature mismatch and refuse to execute it."},

  ],

  ],

/* ---------------------------------------------------------------
   STATE + PERSISTENCE
--------------------------------------------------------------- */
const STORAGE_KEY = "iotSecRoadmapProgress_v1";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function weekKey(m,w){ return "m"+m+"w"+w; }
function getWeekProgress(m,w){
  const k = weekKey(m,w);
  if(!progress[k]) progress[k] = {known:{}, quizBest:0, quizDone:false, interview:{}};
  return progress[k];
}

let progress = loadProgress();

/* view state */
let view = "overview"; // overview | week
let currentMonth = null, currentWeek = null;
let activeTab = "flashcards"; // flashcards | quiz | interview
let fcIndex = 0, fcFlipped = false;
let quizIndex = 0, quizScore = 0, quizAnswered = false, quizSelected = null, quizFinished = false;

/* ---------------------------------------------------------------
   RENDER
--------------------------------------------------------------- */
const root = document.getElementById("app");

function render(){
  if(view === "overview") renderOverview();
  else renderWeek();
}

function monthMeta(m){
  return {
    1:{name:"Month 1", sub:"Bare-Metal + FreeRTOS + Bridge", cls:""},
    2:{name:"Month 2", sub:"Cryptography + Secure Transport", cls:"m2"},
    3:{name:"Month 3", sub:"Firmware Security + Interview Ready", cls:"m3"}
  }[m];
}

function weekStatus(m,w){
  const p = getWeekProgress(m,w);
  const wk = WEEKS.find(x=>x.month===m && x.week===w);
  const fcTotal = wk.flashcards.length;
  const fcKnown = Object.values(p.known).filter(Boolean).length;
  const ivTotal = wk.interview.length;
  const ivDone = Object.values(p.interview).filter(Boolean).length;
  const totalUnits = fcTotal + 1 + ivTotal; // flashcards + quiz + interview items
  const doneUnits = fcKnown + (p.quizDone?1:0) + ivDone;
  if(doneUnits === 0) return {label:"To do", cls:"chip-todo", pct:0};
  if(doneUnits >= totalUnits) return {label:"Done", cls:"chip-done", pct:100};
  return {label:"In progress", cls:"chip-progress", pct:Math.round(doneUnits/totalUnits*100)};
}

function renderOverview(){
  let html = `
    <div class="topbar">
      <h1>🔐 IoT Security Study</h1>
      <div class="badge">3-Month Roadmap</div>
    </div>
  `;

  for(const m of [1,2,3]){
    const meta = monthMeta(m);
    const weeks = WEEKS.filter(w=>w.month===m);
    let totalPct = 0;
    weeks.forEach(w=>{ totalPct += weekStatus(m,w.week).pct; });
    totalPct = Math.round(totalPct/weeks.length);

    html += `<div class="month-card ${meta.cls}">
      <h2>${meta.name}</h2>
      <p class="sub">${meta.sub}</p>
      <div class="month-progress-track"><div class="month-progress-fill" style="width:${totalPct}%"></div></div>
      <div class="month-progress-label">${totalPct}% complete</div>
    </div>`;

    weeks.forEach(w=>{
      const st = weekStatus(m, w.week);
      html += `<div class="week-row" data-m="${m}" data-w="${w.week}">
        <div class="week-num">W${w.week}</div>
        <div class="week-info">
          <div class="wt">${w.title}</div>
          <div class="ws">${w.flashcards.length} cards · ${w.quiz.length} quiz Qs · ${w.interview.length} interview Qs</div>
        </div>
        <div class="week-chip ${st.cls}">${st.label}</div>
      </div>`;
    });
  }

  root.innerHTML = html;

  document.querySelectorAll(".week-row").forEach(el=>{
    el.addEventListener("click", ()=>{
      currentMonth = parseInt(el.dataset.m);
      currentWeek = parseInt(el.dataset.w);
      view = "week"; activeTab = "flashcards";
      fcIndex = 0; fcFlipped = false;
      quizIndex = 0; quizScore = 0; quizAnswered = false; quizSelected = null; quizFinished = false;
      render();
      window.scrollTo(0,0);
    });
  });
}

function currentWeekData(){
  return WEEKS.find(w=>w.month===currentMonth && w.week===currentWeek);
}

function renderWeek(){
  const wk = currentWeekData();
  const meta = monthMeta(currentMonth);

  let html = `
    <div class="topbar">
      <button class="back-btn" id="backBtn">‹ All weeks</button>
      <div class="badge">${meta.name} · Week ${wk.week}</div>
    </div>
    <div class="week-header">
      <div class="eyebrow">${meta.name}, Week ${wk.week}</div>
      <h2>${wk.title}</h2>
      <p>${wk.summary}</p>
    </div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='flashcards'?'active':''}" data-tab="flashcards">Flashcards</button>
      <button class="tab-btn ${activeTab==='quiz'?'active':''}" data-tab="quiz">Quiz</button>
      <button class="tab-btn ${activeTab==='interview'?'active':''}" data-tab="interview">Interview Qs</button>
    </div>
    <div id="tabContent"></div>
  `;
  root.innerHTML = html;

  document.getElementById("backBtn").addEventListener("click", ()=>{
    view = "overview"; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      activeTab = b.dataset.tab;
      if(activeTab==="flashcards"){ fcIndex=0; fcFlipped=false; }
      if(activeTab==="quiz"){ quizIndex=0; quizScore=0; quizAnswered=false; quizSelected=null; quizFinished=false; }
      render();
    });
  });

  if(activeTab==="flashcards") renderFlashcards(wk);
  else if(activeTab==="quiz") renderQuiz(wk);
  else renderInterview(wk);
}

/* ---------- Flashcards ---------- */
function renderFlashcards(wk){
  const p = getWeekProgress(currentMonth, currentWeek);
  const card = wk.flashcards[fcIndex];
  const knownCount = Object.values(p.known).filter(Boolean).length;

  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="fc-progress">Card ${fcIndex+1} of ${wk.flashcards.length} — ${knownCount} known</div>
    <div class="flip-card">
      <div class="flip-inner ${fcFlipped?'flipped':''}" id="flipInner">
        <div class="flip-face flip-front">
          <div class="flip-label">Question</div>
          <div class="flip-text">${card.q}</div>
          <div class="flip-hint">Tap to flip</div>
        </div>
        <div class="flip-face flip-back">
          <div class="flip-label">Answer</div>
          <div class="flip-text">${card.a}</div>
          <div class="flip-hint">Tap to flip back</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="fc-btn review" id="fcReview">Review again</button>
      <button class="fc-btn known" id="fcKnown">${p.known[fcIndex] ? '✓ Known' : 'Mark known'}</button>
    </div>
    <div class="fc-nav">
      <button id="fcPrev" ${fcIndex===0?'style="visibility:hidden"':''}>‹ Previous</button>
      <button id="fcNext" ${fcIndex===wk.flashcards.length-1?'style="visibility:hidden"':''}>Next ›</button>
    </div>
  `;

  document.getElementById("flipInner").addEventListener("click", ()=>{
    fcFlipped = !fcFlipped;
    document.getElementById("flipInner").classList.toggle("flipped");
  });
  document.getElementById("fcReview").addEventListener("click", ()=>{
    p.known[fcIndex] = false; saveProgress();
    goNextCard(wk);
  });
  document.getElementById("fcKnown").addEventListener("click", ()=>{
    p.known[fcIndex] = true; saveProgress();
    goNextCard(wk);
  });
  document.getElementById("fcPrev").addEventListener("click", ()=>{
    if(fcIndex>0){ fcIndex--; fcFlipped=false; renderFlashcards(wk); }
  });
  document.getElementById("fcNext").addEventListener("click", ()=>{
    if(fcIndex<wk.flashcards.length-1){ fcIndex++; fcFlipped=false; renderFlashcards(wk); }
  });
}
function goNextCard(wk){
  if(fcIndex < wk.flashcards.length-1){ fcIndex++; fcFlipped=false; }
  renderFlashcards(wk);
}

/* ---------- Quiz ---------- */
function renderQuiz(wk){
  const el = document.getElementById("tabContent");
  const p = getWeekProgress(currentMonth, currentWeek);

  if(quizFinished){
    const pct = Math.round((quizScore/wk.quiz.length)*100);
    el.innerHTML = `
      <div class="quiz-card quiz-result">
        <div class="score">${quizScore}/${wk.quiz.length}</div>
        <p>${pct}% correct${p.quizBest>=pct ? ' · best: '+p.quizBest+'%' : ' · new best!'}</p>
        <button class="quiz-retry" id="quizRetry">Retry Quiz</button>
      </div>
    `;
    if(pct > p.quizBest){ p.quizBest = pct; }
    p.quizDone = true;
    saveProgress();
    document.getElementById("quizRetry").addEventListener("click", ()=>{
      quizIndex=0; quizScore=0; quizAnswered=false; quizSelected=null; quizFinished=false;
      renderQuiz(wk);
    });
    return;
  }

  const q = wk.quiz[quizIndex];
  el.innerHTML = `
    <div class="quiz-progress">Question ${quizIndex+1} of ${wk.quiz.length}</div>
    <div class="quiz-card">
      <div class="quiz-q">${q.q}</div>
      <div id="quizOpts"></div>
      ${quizAnswered ? `<div class="quiz-explain">${q.explain}</div><button class="quiz-next" id="quizNext">${quizIndex<wk.quiz.length-1?'Next Question':'See Results'}</button>` : ''}
    </div>
  `;
  const optsEl = document.getElementById("quizOpts");
  q.options.forEach((opt,i)=>{
    const b = document.createElement("button");
    b.className = "quiz-opt" + (quizAnswered ? " disabled" : "");
    if(quizAnswered){
      if(i===q.correct) b.className += " correct";
      else if(i===quizSelected) b.className += " wrong";
    }
    b.textContent = opt;
    b.addEventListener("click", ()=>{
      if(quizAnswered) return;
      quizSelected = i; quizAnswered = true;
      if(i===q.correct) quizScore++;
      renderQuiz(wk);
    });
    optsEl.appendChild(b);
  });

  if(quizAnswered){
    document.getElementById("quizNext").addEventListener("click", ()=>{
      if(quizIndex < wk.quiz.length-1){
        quizIndex++; quizAnswered=false; quizSelected=null;
        renderQuiz(wk);
      } else {
        quizFinished = true;
        renderQuiz(wk);
      }
    });
  }
}

/* ---------- Interview ---------- */
function renderInterview(wk){
  const p = getWeekProgress(currentMonth, currentWeek);
  const el = document.getElementById("tabContent");
  let html = `<div class="empty-hint">Tap a question to see talking points. Mark it once you can answer it out loud, unprompted.</div>`;
  wk.interview.forEach((item, i)=>{
    const open = p.interview["_open"+i] || false;
    const done = !!p.interview[i];
    html += `<div class="iv-card ${open?'open':''}" data-i="${i}">
      <div class="iv-q"><span>${item.q}</span><span class="iv-check ${done?'on':''}" data-check="${i}">${done?'✓':''}</span></div>
      <div class="iv-answer">${item.a}</div>
    </div>`;
  });
  el.innerHTML = html;

  document.querySelectorAll(".iv-card").forEach(card=>{
    card.addEventListener("click", (e)=>{
      const i = parseInt(card.dataset.i);
      if(e.target.dataset.check !== undefined && e.target.dataset.check !== ""){
        p.interview[i] = !p.interview[i];
        saveProgress();
        renderInterview(wk);
        return;
      }
      p.interview["_open"+i] = !p.interview["_open"+i];
      saveProgress();
      renderInterview(wk);
    });
  });
}

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
render();
</script>
</body>
</html>
