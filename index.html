<style>
  :root{
    --bg: #fff8f0;
    --card: #ffffff;
    --ink: #2a1a14;
    --ink-soft: #6b5147;
    --coral: #e0562f;
    --coral-dark: #b83f1e;
    --amber: #f0a439;
    --amber-dark: #cf8620;
    --teal: #2b7a72;
    --teal-dark: #1e5951;
    --sand: #f4e3c9;
    --line: #ecd9c3;
    --good: #2b7a4c;
    --bad: #c53d3d;
    --shadow: 0 4px 14px rgba(120, 70, 30, 0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app{max-width:560px;margin:0 auto;padding:16px 16px 90px;}

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 14px;
  }
  .topbar h1{
    font-size:19px;margin:0;font-weight:800;letter-spacing:-0.3px;
  }
  .topbar .badge{
    font-size:11px;font-weight:700;color:var(--teal-dark);
    background:#e2f1ee;border-radius:20px;padding:5px 10px;
  }
  .badge-row{display:flex;gap:6px;align-items:center;}
  .sync-badge{
    font-size:10.5px;font-weight:700;border-radius:20px;padding:5px 9px;
  }
  .sync-on{background:#dcefe4;color:var(--good);}
  .sync-off{background:var(--sand);color:var(--ink-soft);}
  .back-btn{
    background:none;border:none;color:var(--coral-dark);font-weight:700;
    font-size:15px;padding:8px 4px;cursor:pointer;display:flex;align-items:center;gap:4px;
  }

  /* Overview */
  .month-card{
    background: linear-gradient(135deg, var(--coral), var(--amber));
    border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;
    box-shadow: var(--shadow); color:#fff; position:relative; overflow:hidden;
  }
  .month-card.m2{background: linear-gradient(135deg, var(--teal), #4fa89c);}
  .month-card.m3{background: linear-gradient(135deg, #8a4fc7, #c2599f);}
  .month-card h2{margin:0 0 2px;font-size:17px;font-weight:800;}
  .month-card p.sub{margin:0 0 12px;font-size:12.5px;opacity:0.92;}
  .month-progress-track{
    background:rgba(255,255,255,0.35);border-radius:10px;height:8px;overflow:hidden;margin-bottom:4px;
  }
  .month-progress-fill{background:#fff;height:100%;border-radius:10px;transition:width .3s;}
  .month-progress-label{font-size:11px;opacity:0.9;font-weight:600;}

  .week-row{
    display:flex;align-items:center;gap:12px;
    background: var(--card); border-radius:14px; padding:12px 14px;
    margin-top:10px; box-shadow: 0 1px 0 rgba(0,0,0,0.03); cursor:pointer;
    border:1px solid rgba(255,255,255,0.5);
  }
  .week-row:active{transform:scale(0.98);}
  .week-num{
    width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.28);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    flex-shrink:0;
  }
  .week-info{flex:1;min-width:0;}
  .week-info .wt{font-weight:700;font-size:14.5px;color:var(--ink);}
  .week-info .ws{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .week-chip{
    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;
  }
  .chip-todo{background:var(--sand);color:var(--coral-dark);}
  .chip-progress{background:#fde3c2;color:var(--amber-dark);}
  .chip-done{background:#dcefe4;color:var(--good);}

  /* Week detail */
  .week-header{
    background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .week-header .eyebrow{font-size:11px;font-weight:700;color:var(--coral-dark);text-transform:uppercase;letter-spacing:0.5px;}
  .week-header h2{margin:4px 0 6px;font-size:19px;}
  .week-header p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.4;}

  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    flex:1;padding:10px 4px;text-align:center;border-radius:12px;border:none;
    font-weight:700;font-size:13px;cursor:pointer;background:var(--sand);color:var(--coral-dark);
  }
  .tab-btn.active{background:var(--coral);color:#fff;}

  /* Flashcards */
  .fc-progress{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;font-weight:600;}
  .flip-card{
    perspective:1200px; height:280px; margin-bottom:16px;
  }
  .flip-inner{
    position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;
  }
  .flip-inner.flipped{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;
    border-radius:18px;padding:22px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:var(--shadow);
  }
  .flip-front{background:linear-gradient(160deg, #fff, var(--sand));}
  .flip-back{background:linear-gradient(160deg, var(--teal), var(--teal-dark));color:#fff;transform:rotateY(180deg);}
  .flip-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:0.6;margin-bottom:10px;}
  .flip-back .flip-label{opacity:0.75;}
  .flip-text{font-size:16px;font-weight:600;line-height:1.45;}
  .flip-back .flip-text{font-size:14.5px;font-weight:500;}
  .flip-hint{position:absolute;bottom:14px;right:16px;font-size:11px;opacity:0.5;font-weight:600;}

  .fc-controls{display:flex;gap:10px;}
  .fc-btn{
    flex:1;padding:13px;border-radius:14px;border:none;font-weight:700;font-size:14px;cursor:pointer;
  }
  .fc-btn.review{background:#fbe0d9;color:var(--coral-dark);}
  .fc-btn.known{background:#dcefe4;color:var(--good);}
  .fc-nav{display:flex;justify-content:space-between;margin-top:10px;}
  .fc-nav button{background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:13px;padding:8px;cursor:pointer;}

  /* Quiz */
  .quiz-progress{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;font-weight:600;}
  .quiz-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .quiz-q{font-size:15.5px;font-weight:700;margin-bottom:14px;line-height:1.4;}
  .quiz-opt{
    display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:14px;font-weight:600;
    color:var(--ink);cursor:pointer;
  }
  .quiz-opt.correct{background:#dcefe4;border-color:var(--good);color:var(--good);}
  .quiz-opt.wrong{background:#fbe1e1;border-color:var(--bad);color:var(--bad);}
  .quiz-opt.disabled{pointer-events:none;}
  .quiz-explain{
    background:#fff4e6;border-radius:12px;padding:12px 14px;font-size:13px;color:#6b4b1e;
    margin-top:6px;line-height:1.4;
  }
  .quiz-next{
    margin-top:14px;width:100%;padding:13px;border-radius:14px;border:none;
    background:var(--coral);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;
  }
  .quiz-result{text-align:center;padding:30px 16px;}
  .quiz-result .score{font-size:44px;font-weight:800;color:var(--coral-dark);}
  .quiz-result p{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .quiz-retry{
    margin-top:16px;padding:12px 22px;border-radius:14px;border:none;background:var(--sand);
    color:var(--coral-dark);font-weight:700;cursor:pointer;
  }

  /* Interview */
  .iv-card{
    background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);
    cursor:pointer;
  }
  .iv-q{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .iv-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;}
  .iv-check.on{background:var(--good);border-color:var(--good);color:#fff;}
  .iv-answer{
    margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:10px;display:none;
  }
  .iv-card.open .iv-answer{display:block;}

  .empty-hint{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 10px;}

  /* Track select */
  .track-card{
    border-radius:20px;padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);
    cursor:pointer;color:#fff;position:relative;
  }
  .track-card:active{transform:scale(0.98);}
  .track-core{background:linear-gradient(135deg, var(--coral), var(--amber));}
  .track-project{background:linear-gradient(135deg, #8a4fc7, #c2599f);}
  .track-card h2{margin:0 0 6px;font-size:19px;font-weight:800;}
  .track-card p{margin:0 0 10px;font-size:13px;opacity:0.92;line-height:1.4;}
  .track-card .track-meta{font-size:11.5px;font-weight:700;opacity:0.85;}
  .track-arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:22px;opacity:0.7;}
  .intro-note{
    background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:18px;
    font-size:12.5px;color:var(--ink-soft);line-height:1.5;box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
</style>
</head>

<script>

const CORE_WEEKS = [
{
  month:1, week:1,
  title:"Embedded Systems & Microcontroller Basics",
  summary:"What an MCU actually is, how it talks to the physical world, and the vocabulary every IoT job expects you to know cold.",
  flashcards:[
    {q:"What's the difference between a microcontroller (MCU) and a microprocessor (MPU)?", a:"An MCU integrates a CPU, RAM, flash, and peripherals (GPIO, timers, ADC...) on a single chip, aimed at dedicated embedded tasks. An MPU is just the CPU core, requiring external RAM/storage/peripherals — used when you need a full OS (like Linux) and more processing power, e.g. a Raspberry Pi vs an ESP32."},
    {q:"What is GPIO, and what are the two basic modes a pin can be configured in?", a:"General Purpose Input/Output — pins whose behavior is software-configurable. Input mode reads an external voltage (e.g. a button state); output mode drives the pin high/low to control something (e.g. an LED)."},
    {q:"What does an ADC (Analog-to-Digital Converter) do, and why does an MCU need one?", a:"It converts a continuous analog voltage (e.g. from a temperature sensor or potentiometer) into a discrete digital value the CPU can process — most real-world sensors produce analog signals, but digital logic can only work with discrete numbers."},
    {q:"What is an interrupt, and why is it more efficient than constantly polling a pin in a loop?", a:"A hardware signal that pauses normal execution to run a specific handler function immediately when an event occurs (e.g. a button press). It's more efficient than polling because the CPU can do other work (or sleep) instead of repeatedly checking a pin that hasn't changed."},
    {q:"What does 'memory-mapped I/O' mean?", a:"Peripheral registers (GPIO, UART, timers...) are addressed the same way as RAM — reading/writing a specific memory address reads/writes a hardware register, rather than needing special I/O instructions."},
    {q:"Why does the `volatile` keyword matter in embedded C/C++?", a:"It tells the compiler a variable's value can change outside normal program flow (e.g. by hardware or an interrupt), so it must always re-read the actual memory location instead of assuming a cached value — critical for anything touching hardware registers or shared interrupt state."},
    {q:"What is a datasheet, and why is reading one a core IoT engineering skill?", a:"The manufacturer's technical reference for a chip/component — pinouts, electrical characteristics, register maps, timing diagrams. Nearly every real embedded task (wiring a new sensor, debugging odd behavior, choosing a part) requires reading and correctly interpreting datasheets, not just following a tutorial."}
  ],
  quiz:[
    {q:"Why would you pick an MCU (like an ESP32) over an MPU (like a Raspberry Pi) for a battery-powered sensor node?", options:["MCUs are always faster","MCUs typically draw far less power and don't need a full OS/external RAM for a simple dedicated task", "MPUs can't run C++","MCUs have more RAM"], correct:1, explain:"Power efficiency and simplicity for a dedicated task are the classic reasons to choose an MCU over a full MPU/OS stack."},
    {q:"Why is polling a pin in a tight loop generally worse than using an interrupt for a rare event like a button press?", options:["Polling doesn't work at all","It wastes CPU cycles that could go to other work or power-saving sleep, for an event that rarely happens","Interrupts are illegal in embedded C","Polling uses less code"], correct:1, explain:"Interrupts let the CPU do other useful work (or sleep, saving battery) instead of constantly checking a pin that usually hasn't changed."},
    {q:"Without `volatile`, what's a realistic bug when reading a hardware status flag in a loop?", options:["The code won't compile","The compiler may cache the value in a register, so the loop never sees hardware-driven updates and can hang forever", "It will read random memory","volatile only affects float precision"], correct:1, explain:"This is one of the most common, hard-to-spot embedded bugs — invisible until you test on real hardware."}
  ],
  interview:[
    {q:"Explain the difference between a microcontroller and a microprocessor, with an example of when you'd choose each.", a:"Talking points: integration level, power/cost trade-offs, need for a full OS or not — use concrete examples (ESP32 vs Raspberry Pi)."},
    {q:"Walk me through what an interrupt is and why it matters for embedded power efficiency.", a:"Talking points: contrast with polling, mention sleep modes benefiting from interrupt-driven wake-up rather than busy-waiting."},
    {q:"How comfortable are you reading a component datasheet, and can you describe your process?", a:"Talking points: pinout/electrical specs first, then register map or communication protocol section, then timing diagrams if debugging — show this is a normal, expected workflow for you, not an intimidating one-off."}
  ]
},
{
  month:1, week:2,
  title:"Wired Communication Protocols — UART, SPI, I2C",
  summary:"The three protocols behind almost every sensor and module you'll wire up in any IoT job.",
  flashcards:[
    {q:"What is UART, and what are its defining characteristics?", a:"Universal Asynchronous Receiver/Transmitter — a simple 2-wire (TX/RX) serial protocol with no shared clock line; both sides must agree on a baud rate in advance. Common for simple point-to-point links (debug consoles, GPS modules, chip-to-chip bridges)."},
    {q:"How many wires does SPI use, and what is each for?", a:"Typically 4: SCK (clock), MOSI (master-out-slave-in), MISO (master-in-slave-out), and CS/SS (chip select, one per device) — full-duplex and generally fast."},
    {q:"How many wires does I2C use, and how does it address multiple devices?", a:"2 wires: SDA (data) and SCL (clock), both open-drain with pull-up resistors. Each device has a unique address; the master sends the target address first, and only that device responds — no separate select line needed."},
    {q:"When would you choose I2C over SPI for a project with many sensors?", a:"When pin count is limited and speed requirements are modest — I2C lets you add many devices on just 2 shared wires, while SPI would need a dedicated CS line per device, quickly using up pins."},
    {q:"When would you choose SPI over I2C?", a:"When you need higher throughput (e.g. a display, flash memory, or high-sample-rate sensor) — SPI is generally much faster and full-duplex, at the cost of more pins per device."},
    {q:"What's a common real-world I2C problem when two sensors share the same fixed address?", a:"An address conflict — you can't distinguish them on the same bus without an I2C multiplexer/switch, an address-select pin strap on the part, or choosing a different sensor variant."},
    {q:"What does 'baud rate' mean in UART, and why must both devices agree on it?", a:"The rate (bits per second) data is transmitted. Since UART has no shared clock line, both sides use their own local timing to sample bits — if the baud rates don't match, bytes are misread/garbled."}
  ],
  quiz:[
    {q:"You need to wire up 6 low-speed sensors but only have a few free GPIO pins. Which protocol is the better fit?", options:["SPI, because it's faster","I2C, because it needs only 2 shared wires regardless of device count","UART, because it's simplest","None of these can support multiple devices"], correct:1, explain:"I2C's addressing scheme is exactly what makes it pin-efficient for many low-speed devices on a shared bus."},
    {q:"Two UART devices are connected but data comes through garbled. What's a likely cause?", options:["The wires are the wrong color","A baud rate mismatch between the two devices","I2C interference","The CS line isn't asserted"], correct:1, explain:"Since UART has no shared clock, mismatched baud rates are one of the most common causes of garbled serial data."},
    {q:"Why does SPI typically outperform I2C for high-speed peripherals like displays or flash memory?", options:["SPI uses fewer wires","SPI has no addressing/ACK overhead and dedicated lines, enabling much higher clock speeds","I2C cannot be clocked faster than 1kHz","SPI is a wireless protocol"], correct:1, explain:"The simpler point-to-point wiring and lack of in-band addressing let SPI run substantially faster than typical I2C."}
  ],
  interview:[
    {q:"Compare UART, SPI, and I2C, and tell me when you'd pick each.", a:"Talking points: wire count, speed, addressing scheme, and typical use cases for each — a very common embedded interview question."},
    {q:"Describe a real or plausible wiring bug you'd expect with I2C and how you'd debug it.", a:"Talking points: address conflicts, missing pull-up resistors, or bus lockup, and using a logic analyzer or serial print statements to diagnose."},
    {q:"What tool would you reach for to debug a suspected SPI timing issue, and why?", a:"Talking points: a logic analyzer or oscilloscope to directly observe clock/data lines and timing relationships, rather than guessing from firmware behavior alone."}
  ]
},
{
  month:1, week:3,
  title:"Wireless Protocols Landscape",
  summary:"Wi-Fi, BLE, Zigbee, Thread/Matter, LoRaWAN, and cellular IoT — how to reason about range, power, and bandwidth trade-offs.",
  flashcards:[
    {q:"What's the fundamental trade-off across most IoT wireless protocols?", a:"Range, power consumption, bandwidth, and cost generally trade off against each other — higher bandwidth/longer range typically costs more power and/or money; low-power protocols usually sacrifice range or throughput."},
    {q:"When is Wi-Fi the right choice for an IoT device, and when is it not?", a:"Good when you need high bandwidth and already have home/office Wi-Fi infrastructure (e.g. video streaming, frequent large payloads). Poor for battery-constrained devices needing months/years of battery life, since Wi-Fi radios draw relatively high power."},
    {q:"What is BLE best suited for, and what's its key limitation?", a:"Low-power, short-range, small/infrequent data exchanges (wearables, beacons, sensor readings) — its main limitation is short range (tens of meters) and lower throughput compared to Wi-Fi."},
    {q:"What problem do Zigbee and Z-Wave solve that Wi-Fi/BLE don't as well?", a:"Mesh networking for whole-home device coverage — many low-power nodes relay messages for each other, extending effective range and reliability across a house without needing every device to reach a central Wi-Fi router directly."},
    {q:"What is Matter (and its underlying Thread protocol), and why does it matter for the smart home industry?", a:"An emerging cross-vendor standard aiming to make smart home devices interoperable regardless of brand (so a Matter-certified lamp works with any Matter-compatible hub/app) — increasingly relevant knowledge for anyone entering consumer IoT roles."},
    {q:"What is LoRaWAN designed for, and what's the trade-off?", a:"Long-range (kilometers), very low-power communication for small, infrequent payloads (e.g. agricultural sensors, utility meters) — the trade-off is very low bandwidth and higher latency, unsuitable for anything data-heavy or real-time."},
    {q:"What's the role of cellular IoT protocols like NB-IoT and LTE-M?", a:"They provide wide-area cellular connectivity optimized for low-power, low-bandwidth IoT devices (unlike full LTE/5G data plans), useful when a device is out of Wi-Fi/LoRaWAN gateway range but still needs occasional connectivity, e.g. remote asset tracking."}
  ],
  quiz:[
    {q:"A battery-powered soil moisture sensor needs to report data twice a day from a farm field kilometers from any building. Which protocol family fits best?", options:["Wi-Fi","BLE","LoRaWAN or NB-IoT/cellular IoT","Zigbee"], correct:2, explain:"Long range and very low power for infrequent small payloads is exactly LoRaWAN/cellular-IoT's design target — Wi-Fi/BLE/Zigbee all have far shorter range."},
    {q:"Why might a smart home lamp use Zigbee instead of direct Wi-Fi?", options:["Zigbee is faster than Wi-Fi","Zigbee's mesh networking and low power draw suit many always-on, low-bandwidth home devices better than Wi-Fi's higher power draw","Wi-Fi can't control lamps","Zigbee has longer range than cellular"], correct:1, explain:"Mesh coverage and low power consumption are Zigbee's core value proposition for smart home device networks."},
    {q:"What is Matter primarily trying to solve in the smart home industry?", options:["Faster internet speeds","Cross-vendor interoperability, so devices from different brands work together seamlessly","Longer battery life for all devices","Replacing Wi-Fi entirely"], correct:1, explain:"Matter's whole purpose is standardizing interoperability across the fragmented smart-home device ecosystem."}
  ],
  interview:[
    {q:"How would you choose a wireless protocol for a new IoT product, given its constraints?", a:"Talking points: walk through range, power budget, bandwidth needs, existing infrastructure, and cost — show a structured decision process, not a memorized answer."},
    {q:"What's the difference between Wi-Fi and BLE that makes each suited to different products?", a:"Talking points: power consumption vs bandwidth/range trade-off, typical use cases for each."},
    {q:"What do you know about Matter/Thread, and why might it matter to a company hiring for a smart home role?", a:"Talking points: interoperability standard, growing industry adoption — shows current industry awareness beyond just technical protocol knowledge."}
  ]
},
{
  month:1, week:4,
  title:"RTOS & Firmware Architecture",
  summary:"Why real IoT firmware often isn't bare-metal, and the core RTOS concepts every embedded job expects.",
  flashcards:[
    {q:"What is an RTOS, and why would you use one instead of bare-metal (a single superloop)?", a:"A Real-Time Operating System provides task scheduling, inter-task communication, and timing guarantees — useful once a device needs to juggle multiple concurrent responsibilities (networking, sensor reading, UI, timers) reliably, rather than manually interleaving everything in one big loop."},
    {q:"What is a 'task' in RTOS terms?", a:"An independent thread of execution with its own stack, scheduled by the RTOS based on priority and readiness — conceptually similar to a lightweight thread in desktop OS terms."},
    {q:"What's the difference between a mutex and a semaphore?", a:"A mutex protects a shared resource and has ownership (the task that locks it must unlock it), with priority inheritance to prevent priority inversion. A semaphore is a signaling mechanism (e.g. an ISR waking a task) without ownership semantics."},
    {q:"What is priority inversion?", a:"A scenario where a high-priority task is blocked waiting on a resource held by a low-priority task, while a medium-priority task keeps preempting the low-priority one — effectively stalling the high-priority task indefinitely. Priority-inheritance mutexes are the standard fix."},
    {q:"Name two popular embedded RTOS options and how they differ in scope.", a:"FreeRTOS: lightweight, widely used, minimal built-in features beyond scheduling/sync primitives (you add networking/etc. yourself). Zephyr: a more full-featured RTOS with built-in networking stacks, device driver models, and broader hardware support, closer to a small embedded OS."},
    {q:"Why can't you safely call most RTOS API functions directly from an interrupt handler?", a:"Regular API calls may block, which isn't allowed in interrupt context. Most RTOSes provide '...FromISR' variants specifically designed to be interrupt-safe and non-blocking."}
  ],
  quiz:[
    {q:"Why might a simple bare-metal superloop become unmanageable as an IoT device gains more responsibilities?", options:["Bare-metal code can't compile with more features","Manually interleaving timing-sensitive tasks (networking, sensors, UI) in one loop becomes fragile and hard to reason about as complexity grows","Bare-metal doesn't support C++","GPIO stops working without an RTOS"], correct:1, explain:"This is exactly why RTOSes exist — structured task scheduling scales far better than hand-rolled interleaving once you have several concurrent responsibilities."},
    {q:"A high-priority task seems to stall while a low-priority task holds a needed resource. What's this called, and what's the standard fix?", options:["Deadlock; fixed by rebooting","Priority inversion; fixed with a priority-inheritance mutex","Race condition; fixed by disabling interrupts permanently","Stack overflow; fixed by increasing RAM"], correct:1, explain:"Textbook priority inversion — priority inheritance is the standard RTOS mechanism to resolve it."},
    {q:"Why do RTOSes provide separate 'FromISR' API variants?", options:["They're identical to regular functions, just renamed","Regular functions may block, which is unsafe/undefined in interrupt context; ISR variants are designed to be safe and non-blocking","FromISR functions run faster in all cases","ISR variants only exist for networking functions"], correct:1, explain:"This distinction is fundamental to RTOS programming and a very common interview/code-review topic."}
  ],
  interview:[
    {q:"When would you choose an RTOS over bare-metal firmware, and when would bare-metal still be the right call?", a:"Talking points: complexity/number of concurrent responsibilities as the deciding factor; bare-metal remains reasonable for very simple, single-purpose devices."},
    {q:"Explain mutex vs semaphore with a concrete example of each.", a:"Talking points: mutex protecting a shared sensor data buffer between tasks; semaphore signaling a task from an ISR when new data arrives."},
    {q:"What is priority inversion and how would you diagnose it in a real system?", a:"Talking points: symptom (a high-priority task missing deadlines), root-cause investigation of task priorities and resource holding, and the priority-inheritance fix."}
  ]
},
{
  month:2, week:5,
  title:"IoT Application-Layer Protocols",
  summary:"MQTT, CoAP, HTTP/REST, and WebSockets — how devices actually talk to servers and each other over the network.",
  flashcards:[
    {q:"What is MQTT, and why is it so common in IoT?", a:"A lightweight publish/subscribe protocol over TCP, designed for constrained devices and unreliable networks. Its low overhead, small message sizes, and decoupled pub/sub model (via a broker) make it a near-default choice for many-device IoT telemetry and control."},
    {q:"What is CoAP, and how does it differ from MQTT?", a:"Constrained Application Protocol — a lightweight protocol modeled after HTTP's request/response style but designed for constrained devices, typically running over UDP rather than TCP. Unlike MQTT's broker-based pub/sub, CoAP is more like a lightweight REST call directly between devices."},
    {q:"What does 'QoS' mean in MQTT, and what are the three levels?", a:"Quality of Service — delivery guarantees. QoS 0: at most once (fire-and-forget, may be lost). QoS 1: at least once (guaranteed, may duplicate). QoS 2: exactly once (guaranteed, no duplicates, highest overhead)."},
    {q:"Why is HTTP/REST sometimes a poor fit for constrained IoT devices, despite being extremely common on the web?", a:"HTTP has relatively high per-request overhead (headers, connection setup) compared to MQTT/CoAP, and its request/response model doesn't naturally support a server pushing unsolicited updates to a device the way pub/sub does — though it's still fine for less constrained devices or gateway-to-cloud communication."},
    {q:"What is a WebSocket, and when might an IoT system use one?", a:"A persistent, full-duplex connection over a single TCP handshake, allowing real-time bidirectional data flow — useful for something like a live dashboard needing continuous updates from a gateway/cloud service, though less common directly on constrained end devices."},
    {q:"What does the pub/sub model (as used by MQTT) decouple, that request/response doesn't?", a:"Publishers and subscribers never need to know about each other directly — they only need to agree on a topic name, with a broker handling all routing. This makes it easy to add new subscribers (e.g. a new dashboard) without changing anything on the publishing device."}
  ],
  quiz:[
    {q:"Why is MQTT generally preferred over plain HTTP polling for a fleet of thousands of battery-powered sensors?", options:["MQTT has no data limits","MQTT's lower overhead and pub/sub push model avoid the cost of repeated HTTP connection setup and constant polling","HTTP cannot run on embedded devices","MQTT doesn't require TCP"], correct:1, explain:"Lower per-message overhead and push-based delivery (vs. constant client polling) is exactly why MQTT dominates large-scale IoT telemetry."},
    {q:"Which MQTT QoS level guarantees exactly-once delivery, at the cost of more overhead?", options:["QoS 0","QoS 1","QoS 2","MQTT has no delivery guarantees"], correct:2, explain:"QoS 2 uses a 4-step handshake specifically to guarantee exactly-once delivery."},
    {q:"What's a key architectural difference between CoAP and MQTT?", options:["CoAP requires a broker, MQTT doesn't","CoAP is closer to lightweight request/response (like REST) typically over UDP, while MQTT is broker-based pub/sub over TCP","They are functionally identical","MQTT can't be used with sensors"], correct:1, explain:"This distinction — REST-like vs. pub/sub — is the core conceptual difference worth understanding for protocol selection."}
  ],
  interview:[
    {q:"Explain the difference between MQTT and CoAP, and when you'd choose each.", a:"Talking points: pub/sub vs request/response model, TCP vs UDP, typical use cases for each."},
    {q:"Why would you choose MQTT over plain REST/HTTP for a large IoT device fleet?", a:"Talking points: overhead per message, push vs. polling, broker-based decoupling enabling easy addition of new consumers."},
    {q:"What MQTT QoS level would you choose for a critical command (e.g. 'unlock door') vs. a routine sensor reading, and why?", a:"Talking points: QoS 2 or 1 for a critical, must-not-be-lost/duplicated command; QoS 0 often acceptable for frequent, loss-tolerant telemetry."}
  ]
},
{
  month:2, week:6,
  title:"IoT System Architecture & Cloud Platforms",
  summary:"Edge vs cloud, gateways, device shadows, and the big cloud IoT platforms you'll likely encounter on the job.",
  flashcards:[
    {q:"What's the difference between 'edge' and 'cloud' processing in an IoT architecture?", a:"Edge processing happens locally (on the device or a nearby gateway), reducing latency and bandwidth use and enabling offline operation. Cloud processing happens on remote servers, offering more compute power and centralized data/analytics, at the cost of network dependency and latency."},
    {q:"What is an IoT gateway, and why is one often needed?", a:"A device that bridges constrained/local-protocol devices (Zigbee, BLE, LoRaWAN) to the internet/cloud, since many low-power end devices can't directly speak internet protocols or reach the cloud themselves."},
    {q:"What is a 'device shadow' (or 'digital twin'), as used by platforms like AWS IoT?", a:"A cloud-side virtual representation of a device's last-known state, letting applications read/query state or queue desired-state changes even when the physical device is temporarily offline — the device syncs up when it reconnects."},
    {q:"Name three major cloud IoT platforms and one thing each is known for.", a:"AWS IoT Core (device shadows, deep AWS ecosystem integration), Azure IoT Hub (strong device management/twin features, Microsoft ecosystem integration), Google Cloud IoT (historically strong data analytics/BigQuery integration — note Google deprecated its original Cloud IoT Core service, so check current offerings)."},
    {q:"Why might a smart factory choose edge processing for a safety-critical sensor, rather than sending everything to the cloud?", a:"Latency and reliability — a safety shutoff can't wait on a round-trip to the cloud or risk losing connectivity at a critical moment; local edge logic can react immediately regardless of internet status."},
    {q:"What's device provisioning, at a high level?", a:"The process of securely registering a new device with a cloud platform/fleet — assigning it an identity, credentials, and initial configuration, ideally at manufacturing time or first boot, so it can securely connect and be managed going forward."}
  ],
  quiz:[
    {q:"Why would a factory floor control system favor edge processing over sending every sensor reading to the cloud first?", options:["Cloud processing is always more accurate","Local decisions avoid network latency/dependency for time- and safety-critical responses","Edge devices are always cheaper","Cloud platforms can't process sensor data"], correct:1, explain:"Latency and offline-resilience for safety-critical control loops is the classic edge-computing justification."},
    {q:"What problem does a 'device shadow' solve?", options:["It backs up firmware images","It lets applications query/set a device's state even while the device is temporarily offline, syncing when it reconnects","It encrypts device data","It replaces the need for a network connection entirely"], correct:1, explain:"Device shadows/digital twins decouple application logic from a device's real-time connectivity status."},
    {q:"Why is an IoT gateway often necessary in a mixed-protocol deployment (e.g. Zigbee sensors + cloud dashboard)?", options:["Gateways are only for security","Many constrained end devices can't speak internet protocols directly and need a bridge to reach the cloud","Zigbee devices can connect to the cloud without help","Gateways replace the need for sensors"], correct:1, explain:"Bridging a local, low-power protocol to internet connectivity is the core function of an IoT gateway."}
  ],
  interview:[
    {q:"How would you decide what processing happens at the edge vs. in the cloud for a given IoT system?", a:"Talking points: latency requirements, offline-resilience needs, bandwidth/cost, and compute intensity — a structured trade-off discussion, not a fixed rule."},
    {q:"What's a device shadow/digital twin, and why is it useful?", a:"Talking points: decoupling application/state queries from real-time device connectivity, syncing on reconnect."},
    {q:"Have you used or studied any cloud IoT platform (AWS IoT Core, Azure IoT Hub, etc.)? Walk me through what you know.", a:"Talking points: even conceptual familiarity with device provisioning, shadows/twins, and telemetry ingestion pipelines is valuable to mention here."}
  ]
},
{
  month:2, week:7,
  title:"Device Management, Telemetry & OTA Updates",
  summary:"Keeping a fleet of deployed devices alive, monitored, and updatable — a huge part of real IoT jobs beyond initial development.",
  flashcards:[
    {q:"What is 'telemetry' in an IoT context?", a:"Data a device periodically reports about itself or its environment (sensor readings, health/status metrics) sent back to a server/cloud for monitoring, analytics, or triggering actions."},
    {q:"Why is fleet/device management a distinct discipline from just 'writing firmware'?", a:"Once you have more than a handful of deployed devices, you need to track which firmware version each is running, monitor health/connectivity, manage credentials, and roll out updates — problems that don't exist with a single prototype on your desk."},
    {q:"What is OTA (Over-The-Air) updating, at a high level?", a:"The ability to remotely update a device's firmware over its network connection, without physical access — essential for fixing bugs or adding features to devices already deployed in the field, sometimes at massive scale."},
    {q:"What's a key risk of OTA updates, and a common mitigation?", a:"A failed or interrupted update can 'brick' a device (leave it unbootable). A common mitigation is an A/B (dual-partition) update scheme: the new firmware is written to an inactive partition and only switched to as the active one after being verified to boot successfully, with automatic fallback to the previous known-good partition otherwise."},
    {q:"Why might you version firmware and track it centrally across your fleet?", a:"To know exactly what code is running where — critical for debugging field issues, staged rollouts (testing an update on a small percentage of devices first), and compliance/audit purposes."},
    {q:"What's a 'staged' or 'canary' rollout, and why use one for OTA updates?", a:"Rolling out an update to a small subset of devices first, monitoring for problems, before pushing to the entire fleet — limits the blast radius if the new firmware has an unexpected bug."}
  ],
  quiz:[
    {q:"Why is fleet management a meaningfully different problem from developing firmware for a single prototype device?", options:["It isn't different at all","At scale you must track versions, health, and rollouts across many devices you can't physically access","Fleet management only applies to cloud servers, not IoT devices","Firmware development stops mattering once deployed"], correct:1, explain:"This operational dimension — managing many already-deployed devices — is a major, distinct part of real IoT engineering work."},
    {q:"What does an A/B (dual-partition) OTA scheme protect against?", options:["Network latency","A failed/interrupted update permanently bricking the device, by keeping a verified-good fallback partition","Running out of storage space","Battery drain during normal operation"], correct:1, explain:"This is the standard defense against the single biggest OTA risk — an unrecoverable failed update in the field."},
    {q:"Why would a company do a canary/staged rollout instead of pushing a new firmware version to 100% of devices at once?", options:["It's slower for no benefit","It limits how many devices are affected if the new firmware has an undiscovered bug","Staged rollouts are required by law","It reduces the total number of devices that need updating"], correct:1, explain:"Limiting blast radius for an unexpected regression is the entire point of staged/canary deployment strategies."}
  ],
  interview:[
    {q:"What would you need to think about differently once a device you built goes from '1 prototype on your desk' to '10,000 units in the field'?", a:"Talking points: fleet visibility/monitoring, OTA update mechanisms and their failure modes, version tracking, and remote diagnostics — shows awareness beyond the development phase alone."},
    {q:"How would you design an OTA update mechanism to minimize the risk of bricking devices?", a:"Talking points: A/B partitioning with fallback, staged/canary rollout, and pre-update verification checks."},
    {q:"What telemetry would you want a deployed device to report, and why?", a:"Talking points: give concrete examples relevant to a plausible device (battery level, connectivity status, error counts, firmware version) and explain what decisions each metric would inform."}
  ]
},
{
  month:2, week:8,
  title:"Power Management & Sensor Interfacing",
  summary:"Battery life math, sleep modes, and the practical side of choosing and wiring sensors.",
  flashcards:[
    {q:"What are the typical MCU power states worth knowing, from highest to lowest power draw?", a:"Active (fully running, executing code) → Modem/Light sleep (CPU paused or slowed, some peripherals still active, fast wake) → Deep sleep (most of the chip powered down, only specific wake sources like a timer or external pin active, slower wake, state may be lost) → Hibernation/shutdown (minimal power, essentially a soft power-off)."},
    {q:"Why does the choice between light sleep and deep sleep matter for a battery-powered device?", a:"Deep sleep saves far more power but usually loses RAM contents (requiring re-initialization on wake) and has slower wake-up latency; light sleep preserves more state and wakes faster but draws more power — the right choice depends on how often the device needs to wake and how much state must persist."},
    {q:"How would you roughly estimate a battery-powered device's expected battery life?", a:"Estimate average current draw across its duty cycle (mostly sleeping, briefly active) weighted by time in each state, then divide the battery's capacity (mAh) by that average current (mA) to estimate hours of runtime — real designs also account for battery self-discharge and voltage regulator efficiency."},
    {q:"What's the practical difference between an analog and a digital sensor output, from a wiring/interfacing perspective?", a:"An analog sensor outputs a continuous voltage requiring an ADC to read; a digital sensor already outputs discrete values, often over a standard bus (I2C/SPI/UART) with a defined communication protocol you must implement/follow per its datasheet."},
    {q:"Why might you add a hardware debounce (or software debounce delay) when reading a mechanical button/switch?", a:"Mechanical contacts physically 'bounce' for a few milliseconds when pressed/released, producing multiple rapid transitions that a fast digital read would misinterpret as several separate presses — debouncing filters this out."},
    {q:"Why is choosing the right sensor for a job about more than just 'does it measure the right thing'?", a:"You also need to consider power draw, interface compatibility (I2C vs SPI vs analog), accuracy/resolution needs, physical size, and cost — a technically 'more accurate' sensor is often the wrong choice if it draws too much power or needs an interface your MCU doesn't support well."}
  ],
  quiz:[
    {q:"A device wakes briefly every 10 minutes to take a reading, then sleeps for the rest of the time. Which sleep mode is likely most appropriate?", options:["Always stay in active mode for reliability","Deep sleep, since the wake interval is long and most state can be reinitialized cheaply on wake","Never sleep, since sleep modes are unreliable","Light sleep only, deep sleep should never be used"], correct:1, explain:"Long, infrequent wake intervals are exactly where deep sleep's power savings outweigh its slower wake latency and state loss."},
    {q:"Why would you need a debounce delay when reading a physical push-button?", options:["Buttons are inherently analog devices","Mechanical contact bounce causes multiple rapid transitions that could be misread as several presses","Debouncing is only needed for I2C devices","It's purely a software style preference with no functional reason"], correct:1, explain:"Contact bounce is a real physical phenomenon in mechanical switches — debouncing (hardware or software) is standard practice."},
    {q:"Why might you reject a highly accurate sensor for a battery-powered wearable design?", options:["Accuracy never matters in a design decision","If its power draw or interface requirements don't fit your power/pin budget, a less accurate but appropriate sensor may be the better engineering choice","More accurate sensors are always more power efficient","Sensor choice has no effect on wearable design"], correct:1, explain:"Real sensor selection is a multi-factor trade-off, not a single-metric optimization — a key practical engineering judgment."}
  ],
  interview:[
    {q:"How would you estimate the battery life of a device you're designing?", a:"Talking points: duty cycle across power states, average current calculation, dividing battery capacity by average draw — walk through a rough example."},
    {q:"When would you choose deep sleep over light sleep, and what's the trade-off?", a:"Talking points: wake frequency, state persistence needs, and wake-up latency tolerance."},
    {q:"Walk me through your process for selecting a sensor for a new project requirement.", a:"Talking points: multi-factor evaluation (accuracy, interface, power, cost, footprint) rather than picking the first sensor that measures the right physical quantity."}
  ]
},
{
  month:3, week:9,
  title:"IoT Security Fundamentals",
  summary:"The conceptual security literacy every IoT engineer needs — threats, authentication, and encryption basics, without requiring deep crypto specialization.",
  flashcards:[
    {q:"Why is IoT security often considered especially challenging compared to traditional IT security?", a:"IoT devices are frequently resource-constrained (limited compute/memory for strong crypto), deployed in physically accessible/unattended locations, produced in huge numbers making patching hard, and often have long deployment lifetimes exceeding typical software support windows."},
    {q:"What was the Mirai botnet, and what vulnerability did it exploit?", a:"A large-scale IoT botnet (2016) that compromised hundreds of thousands of IoT devices (cameras, routers) by scanning for and logging into them using default/hardcoded factory credentials that were never changed — a now-famous cautionary example of the risk of shipping devices with weak default credentials."},
    {q:"What are the three properties in the 'CIA triad' of security, and give a one-line meaning for each?", a:"Confidentiality: data can't be read by unauthorized parties. Integrity: data can't be tampered with undetected. Availability: the system keeps functioning for legitimate users/uses."},
    {q:"At a conceptual level, what does 'encryption' provide, and what does it NOT provide by itself?", a:"Encryption alone provides confidentiality (data can't be read without the key) but does not by itself guarantee integrity — an attacker could still tamper with ciphertext bits without needing to read the plaintext, unless a separate integrity mechanism (like a MAC, or an AEAD construction) is also used."},
    {q:"What's the basic idea behind secure device provisioning?", a:"Giving each device a unique cryptographic identity (e.g. a certificate or key) at manufacturing/setup time, rather than a shared default password or key across an entire product line — so compromising one device doesn't compromise the whole fleet."},
    {q:"Why is 'defense in depth' a useful security principle for IoT systems specifically?", a:"Given IoT devices' resource constraints and physical exposure, no single defense is likely bulletproof — layering multiple, independent protections (secure credentials, encrypted transport, input validation, network segmentation) means one layer failing doesn't automatically compromise the whole system."},
    {q:"What's a practical, low-effort security practice every IoT engineer should follow regardless of role?", a:"Never ship or commit hardcoded default credentials, and force/encourage credential changes at first setup — directly addressing the exact failure mode that enabled Mirai-scale botnets."}
  ],
  quiz:[
    {q:"What made the Mirai botnet possible at such large scale?", options:["A zero-day exploit in TLS","Widespread use of unchanged default/hardcoded credentials across many IoT devices","A physical hardware flaw in all routers","A vulnerability in the electrical grid"], correct:1, explain:"Mirai is the textbook example cited across the industry for why default-credential hygiene matters at IoT scale."},
    {q:"Does encrypting a message automatically protect it from tampering?", options:["Yes, encryption always includes tamper detection","No — encryption alone provides confidentiality; a separate integrity mechanism (MAC or AEAD) is needed to detect tampering","Only if using AES specifically","Only for wireless protocols"], correct:1, explain:"This distinction — confidentiality vs. integrity — is one of the most commonly tested security fundamentals in interviews."},
    {q:"Why is secure per-device provisioning (unique credentials per device) better than a single shared factory credential?", options:["It's not actually better, shared credentials are simpler and fine","Compromising one device's credentials doesn't compromise the entire fleet","Shared credentials are illegal","Per-device credentials use less memory"], correct:1, explain:"Blast-radius containment is the core reasoning behind per-device identity provisioning."}
  ],
  interview:[
    {q:"What makes IoT security uniquely challenging compared to typical enterprise IT security?", a:"Talking points: resource constraints limiting crypto choices, physical accessibility, massive scale making patching hard, and long device lifetimes."},
    {q:"Explain the difference between confidentiality and integrity, with a concrete example of a failure of each.", a:"Talking points: reading someone's private sensor data (confidentiality failure) vs. an attacker silently altering a sensor reading in transit (integrity failure) — encryption alone addresses only the first."},
    {q:"What's one thing you'd insist on for any IoT product you worked on, security-wise, even under time pressure?", a:"Talking points: no hardcoded/shared default credentials — a low-effort, high-impact baseline practice, tying back to real incidents like Mirai."}
  ]
},
{
  month:3, week:10,
  title:"Testing & Debugging Embedded Systems",
  summary:"The practical toolkit and mindset for finding and fixing bugs in real hardware — a skill that separates working engineers from tutorial-followers.",
  flashcards:[
    {q:"What is JTAG/SWD, and what's it used for?", a:"Standard hardware debug interfaces (JTAG is older/more general, SWD — Serial Wire Debug — is common on ARM Cortex-M chips) that let a debug probe connect to the chip to set breakpoints, single-step code, and inspect memory/registers directly on real hardware, not just in simulation."},
    {q:"What's the difference between a breakpoint and a watchpoint when debugging?", a:"A breakpoint halts execution at a specific line/address of code. A watchpoint halts execution when a specific memory location's value changes, regardless of which code path touched it — useful for tracking down unexpected/unintended writes to shared state."},
    {q:"What's a logic analyzer used for, and how does it differ from an oscilloscope?", a:"A logic analyzer captures and decodes multiple digital signal lines simultaneously (e.g. an entire I2C/SPI/UART bus) over time, showing you the actual bit-level communication. An oscilloscope shows analog voltage waveforms in fine detail (useful for signal integrity, noise, timing edges) but typically handles fewer channels."},
    {q:"Why is 'it works on my desk but fails in the field' such a common embedded bug category, and what's a general strategy for it?", a:"Field conditions differ in power stability, temperature, RF interference, timing edge cases, and physical vibration/connector wear that a desk setup doesn't reproduce. Strategy: add defensive logging/telemetry from the start, and try to reproduce field conditions (power brownouts, distance/interference) during testing where possible."},
    {q:"What's a race condition, in plain terms, and why are they notoriously hard to debug?", a:"Unsynchronized concurrent access to shared data/state producing inconsistent or wrong behavior depending on timing — hard to debug because they're often intermittent, may not reproduce under a debugger (which changes timing), and require careful reasoning about concurrency rather than just reading code linearly."},
    {q:"Why is unit testing pure logic (data parsing, state machines) separately from hardware-dependent code a valuable embedded testing practice?", a:"It lets you run fast, repeatable automated tests on a PC (no hardware needed) for the parts of your code that don't actually touch registers/peripherals, catching logic bugs early without needing to flash real hardware for every change."}
  ],
  quiz:[
    {q:"You suspect a shared variable is being modified unexpectedly from an interrupt. What debugging tool is best suited to catch this directly?", options:["A breakpoint on the interrupt handler's first line","A watchpoint on the variable itself, which triggers regardless of which code path modifies it","Print statements only","Increasing the CPU clock speed"], correct:1, explain:"Watchpoints are specifically designed to catch unexpected modifications to a memory location from any code path, including interrupts."},
    {q:"Why would you reach for a logic analyzer rather than an oscilloscope when debugging an SPI communication issue?", options:["Oscilloscopes cannot see digital signals at all","A logic analyzer can capture and decode all SPI lines simultaneously as readable bit-level data, which is more useful for protocol-level debugging","Logic analyzers are always cheaper","Oscilloscopes are obsolete"], correct:1, explain:"Logic analyzers' multi-channel digital decoding is exactly suited to bus-protocol debugging, versus an oscilloscope's strength in fine analog signal detail."},
    {q:"Why are race conditions often described as 'notoriously hard to debug'?", options:["They always crash the program immediately and obviously","They're often intermittent and timing-dependent, and attaching a debugger can itself change the timing enough to hide the bug", "They only occur in single-threaded code","They are a myth in embedded systems"], correct:1, explain:"The 'observer effect' of debugging tools changing timing, combined with intermittent reproducibility, is what makes race conditions particularly frustrating."}
  ],
  interview:[
    {q:"Tell me about a bug you debugged (or would expect to debug) that only appeared on real hardware, not in simulation.", a:"Talking points: timing, power, or interference-related issues that don't show up on a desk/simulator — demonstrates hardware debugging maturity."},
    {q:"What's your general approach when a bug is intermittent and hard to reproduce?", a:"Talking points: add logging/telemetry to capture more context, try to identify a triggering pattern, consider concurrency/timing issues (race conditions), and use watchpoints if shared state is suspected."},
    {q:"What embedded debugging tools are you comfortable with?", a:"Talking points: JTAG/SWD debuggers, logic analyzers, oscilloscopes, and serial/print debugging — be honest about your actual hands-on experience level with each."}
  ]
},
{
  month:3, week:11,
  title:"IoT Standards & Industry Landscape",
  summary:"Where IoT engineering jobs actually exist, what verticals look like, and the standards/certifications conversations you'll encounter.",
  flashcards:[
    {q:"Name three major IoT industry verticals and roughly what kind of work each involves.", a:"Consumer/smart home (lamps, thermostats, wearables — UX-heavy, cost-sensitive, high volume), Industrial IoT/IIoT (factory sensors, predictive maintenance — reliability/safety-critical, harsher environments, often wired/robust protocols), Healthcare/medical devices (wearable monitors, remote patient monitoring — heavy regulatory requirements, e.g. FDA)."},
    {q:"What does FCC/CE certification broadly relate to, and why should an IoT engineer be aware of it even if not directly responsible for it?", a:"Regulatory certifications (FCC in the US, CE in Europe) confirming a product's radio emissions and electrical safety meet legal requirements for sale in that region — engineers should be aware because design choices (antenna design, shielding, radio power) affect whether a product can pass certification, so it can't be treated as an afterthought."},
    {q:"What is 'Industry 4.0', as a term you might encounter in industrial IoT job postings?", a:"A broad industry term for the trend of integrating IoT sensors, automation, data analytics, and connected machinery into manufacturing and industrial processes — useful vocabulary to recognize even without deep specialization."},
    {q:"Why do industrial IoT (IIoT) environments often still rely on older wired protocols like Modbus/RS-485 alongside newer wireless tech?", a:"Industrial environments prioritize extreme reliability, noise immunity, and long service life — wired protocols like Modbus are proven, simple, robust in electrically noisy factory environments, and many existing installed equipment already speaks them, so wireless often supplements rather than replaces them."},
    {q:"What's a realistic expectation about how much regulatory/certification depth an entry-level IoT engineer needs?", a:"Deep certification expertise is usually a specialized role (RF/compliance engineers), but a general IoT engineer should understand that these requirements exist and can constrain design decisions early — enough awareness to ask the right questions and not be blindsided later in a project."}
  ],
  quiz:[
    {q:"Why might a factory still use Modbus over RS-485 instead of switching entirely to a modern wireless protocol?", options:["Modbus is faster than all wireless protocols","Wired protocols offer superior reliability/noise immunity in harsh industrial environments and much existing equipment already uses them","Wireless is illegal in factories","RS-485 is a wireless protocol"], correct:1, explain:"Industrial environments prioritize robustness and compatibility with existing infrastructure over adopting the newest available technology."},
    {q:"Why should an IoT hardware engineer care about FCC/CE certification even if a specialist handles the formal testing?", options:["They shouldn't, it's entirely someone else's problem","Design choices like antenna and shielding affect whether the product can pass certification, so it needs consideration early, not as an afterthought","Certification only applies to software","FCC/CE only matters for wired devices"], correct:1, explain:"Certification requirements can force design changes — awareness early avoids expensive late-stage redesigns."},
    {q:"What best characterizes the difference between consumer/smart-home IoT work and industrial IoT (IIoT) work?", options:["They are functionally identical roles","Consumer IoT tends to be UX/cost-sensitive and high-volume; IIoT tends to prioritize reliability/safety in harsher environments","Industrial IoT never uses sensors","Consumer IoT doesn't use wireless protocols"], correct:1, explain:"Recognizing these differing priorities helps you understand what a given IoT job posting is actually optimizing for."}
  ],
  interview:[
    {q:"What IoT industry verticals are you most interested in, and why?", a:"Talking points: be genuine and specific — connect your interests/background (e.g. embedded security experience) to a plausible vertical (industrial, consumer, healthcare) rather than a generic answer."},
    {q:"What do you know about regulatory considerations (FCC/CE) in IoT product development?", a:"Talking points: conceptual awareness that these exist and constrain design early — you don't need deep expertise, just informed awareness."},
    {q:"How do industrial IoT and consumer IoT engineering priorities differ, in your understanding?", a:"Talking points: reliability/safety/harsh-environment focus vs. UX/cost/volume focus — shows breadth of industry awareness beyond just technical protocol knowledge."}
  ]
},
{
  month:3, week:12,
  title:"Job Readiness — Resume, Portfolio & Interview Prep",
  summary:"Pulling the whole curriculum together into a coherent story you can tell confidently in any IoT interview.",
  flashcards:[
    {q:"What's a strong structure for describing your technical background in an IoT interview, when you have both broad and specialized experience?", a:"Lead with the specific role-relevant strength first (tailored to the job description), then broaden out — e.g. 'I have hands-on experience across the IoT stack from embedded firmware through cloud connectivity, plus specialized depth in [your differentiator]' rather than a flat chronological list."},

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
  if(!syncEnabled || applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    db.collection("progressSync").doc(SYNC_DOC_ID).set({data: progress, updatedAt: Date.now()})
      .catch(err=>console.warn("Sync write failed:", err));
  }, 500);
}

function initSync(){
  if(!syncEnabled) return;
  db.collection("progressSync").doc(SYNC_DOC_ID).onSnapshot(doc=>{
    if(doc.exists && doc.data() && doc.data().data){
      applyingRemote = true;
      progress = doc.data().data;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
      render();
      applyingRemote = false;
    } else {
      db.collection("progressSync").doc(SYNC_DOC_ID).set({data: progress, updatedAt: Date.now()})
        .catch(err=>console.warn("Initial sync push failed:", err));
    }
  }, err=>{ console.warn("Sync listener failed:", err); });
}

function weekStatus(track,m,w){
  const p = getWeekProgress(track,m,w);
  const wk = TRACKS[track].weeks.find(x=>x.month===m && x.week===w);
  const fcTotal = wk.flashcards.length;
  const fcKnown = Object.values(p.known).filter(Boolean).length;
  const ivTotal = wk.interview.length;
  const ivDone = Object.values(p.interview).filter(Boolean).length;
  const totalUnits = fcTotal + 1 + ivTotal; // flashcards + quiz + interview items
  const doneUnits = fcKnown + (p.quizDone?1:0) + ivDone;
  if(doneUnits === 0) return {label:"To do", cls:"chip-todo", pct:0};
  if(doneUnits >= totalUnits) return {label:"Done", cls:"chip-done", pct:100};
  return {label:"In progress", cls:"chip-progress", pct:Math.round(doneUnits/totalUnits*100)};
}

function trackOverallPct(track){
  const t = TRACKS[track];
  let sum=0, count=0;
  t.months.forEach(m=>{
    t.weeks.filter(w=>w.month===m).forEach(w=>{
      sum += weekStatus(track,m,w.week).pct; count++;
    });
  });
  return count ? Math.round(sum/count) : 0;
}

      currentTrack = el.dataset.track;
      view = "overview";
      render();
      window.scrollTo(0,0);
    });
  });
}

function renderOverview(){
  const t = TRACKS[currentTrack];
  let html = `
    <div class="topbar">
      <button class="back-btn" id="trackBackBtn">‹ Tracks</button>
      <div class="badge-row">
        <div class="badge">${t.label}</div>
        <div class="sync-badge ${syncEnabled?'sync-on':'sync-off'}">${syncEnabled?'☁️':'📴'}</div>
      </div>
    </div>
  `;

  for(const m of t.months){
    const meta = t.monthMeta[m];
    const weeks = t.weeks.filter(w=>w.month===m);
    let totalPct = 0;
    weeks.forEach(w=>{ totalPct += weekStatus(currentTrack,m,w.week).pct; });
    totalPct = Math.round(totalPct/weeks.length);

    html += `<div class="month-card ${meta.cls}">
      <h2>${meta.name}</h2>
      <p class="sub">${meta.sub}</p>
      <div class="month-progress-track"><div class="month-progress-fill" style="width:${totalPct}%"></div></div>
      <div class="month-progress-label">${totalPct}% complete</div>
    </div>`;

    weeks.forEach(w=>{
      const st = weekStatus(currentTrack, m, w.week);
      const label = currentTrack==="project" ? "Phase "+w.week : "W"+w.week;
      html += `<div class="week-row" data-m="${m}" data-w="${w.week}">
        <div class="week-num">${label}</div>
        <div class="week-info">
          <div class="wt">${w.title}</div>
          <div class="ws">${w.flashcards.length} cards · ${w.quiz.length} quiz Qs · ${w.interview.length} interview Qs</div>
        </div>
        <div class="week-chip ${st.cls}">${st.label}</div>
      </div>`;
    });
  }

  root.innerHTML = html;

  document.getElementById("trackBackBtn").addEventListener("click", ()=>{
    view = "trackSelect"; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll(".week-row").forEach(el=>{
    el.addEventListener("click", ()=>{
      currentMonth = parseInt(el.dataset.m);
      currentWeek = parseInt(el.dataset.w);
      view = "week"; activeTab = "flashcards";
      fcIndex = 0; fcFlipped = false;
      quizIndex = 0; quizScore = 0; quizAnswered = false; quizSelected = null; quizFinished = false;
      render();
      window.scrollTo(0,0);
    });
  });
}

function currentWeekData(){
  return TRACKS[currentTrack].weeks.find(w=>w.month===currentMonth && w.week===currentWeek);
}

function renderWeek(){
  const wk = currentWeekData();
  const t = TRACKS[currentTrack];
  const meta = t.monthMeta[currentMonth];
  const label = currentTrack==="project" ? "Phase "+wk.week : "Week "+wk.week;

  let html = `
    <div class="topbar">
      <button class="back-btn" id="backBtn">‹ ${t.label}</button>
      <div class="badge-row">
        <div class="badge">${label}</div>
        <div class="sync-badge ${syncEnabled?'sync-on':'sync-off'}">${syncEnabled?'☁️':'📴'}</div>
      </div>
    </div>
    <div class="week-header">
      <div class="eyebrow">${meta.name} · ${label}</div>
      <h2>${wk.title}</h2>
      <p>${wk.summary}</p>
    </div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='flashcards'?'active':''}" data-tab="flashcards">Flashcards</button>
      <button class="tab-btn ${activeTab==='quiz'?'active':''}" data-tab="quiz">Quiz</button>
      <button class="tab-btn ${activeTab==='interview'?'active':''}" data-tab="interview">Interview Qs</button>
    </div>
    <div id="tabContent"></div>
  `;
  root.innerHTML = html;

  document.getElementById("backBtn").addEventListener("click", ()=>{
    view = "overview"; render(); window.scrollTo(0,0);
  });
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      activeTab = b.dataset.tab;
      if(activeTab==="flashcards"){ fcIndex=0; fcFlipped=false; }
      if(activeTab==="quiz"){ quizIndex=0; quizScore=0; quizAnswered=false; quizSelected=null; quizFinished=false; }
      render();
    });
  });

  if(activeTab==="flashcards") renderFlashcards(wk);
  else if(activeTab==="quiz") renderQuiz(wk);
  else renderInterview(wk);
}

/* ---------- Flashcards ---------- */
function renderFlashcards(wk){
  const p = getWeekProgress(currentTrack, currentMonth, currentWeek);
  const card = wk.flashcards[fcIndex];
  const knownCount = Object.values(p.known).filter(Boolean).length;

  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="fc-progress">Card ${fcIndex+1} of ${wk.flashcards.length} — ${knownCount} known</div>
    <div class="flip-card">
      <div class="flip-inner ${fcFlipped?'flipped':''}" id="flipInner">
        <div class="flip-face flip-front">
          <div class="flip-label">Question</div>
          <div class="flip-text">${card.q}</div>
          <div class="flip-hint">Tap to flip</div>
        </div>
        <div class="flip-face flip-back">
          <div class="flip-label">Answer</div>
          <div class="flip-text">${card.a}</div>
          <div class="flip-hint">Tap to flip back</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="fc-btn review" id="fcReview">Review again</button>
      <button class="fc-btn known" id="fcKnown">${p.known[fcIndex] ? '✓ Known' : 'Mark known'}</button>
    </div>
    <div class="fc-nav">
      <button id="fcPrev" ${fcIndex===0?'style="visibility:hidden"':''}>‹ Previous</button>
      <button id="fcNext" ${fcIndex===wk.flashcards.length-1?'style="visibility:hidden"':''}>Next ›</button>
    </div>
  `;

  document.getElementById("flipInner").addEventListener("click", ()=>{
    fcFlipped = !fcFlipped;
    document.getElementById("flipInner").classList.toggle("flipped");
  });
  document.getElementById("fcReview").addEventListener("click", ()=>{
    p.known[fcIndex] = false; saveProgress();
    goNextCard(wk);
  });
  document.getElementById("fcKnown").addEventListener("click", ()=>{
    p.known[fcIndex] = true; saveProgress();
    goNextCard(wk);
  });
  document.getElementById("fcPrev").addEventListener("click", ()=>{
    if(fcIndex>0){ fcIndex--; fcFlipped=false; renderFlashcards(wk); }
  });
  document.getElementById("fcNext").addEventListener("click", ()=>{
    if(fcIndex<wk.flashcards.length-1){ fcIndex++; fcFlipped=false; renderFlashcards(wk); }
  });
}
function goNextCard(wk){
  if(fcIndex < wk.flashcards.length-1){ fcIndex++; fcFlipped=false; }
  renderFlashcards(wk);
}

/* ---------- Quiz ---------- */
function renderQuiz(wk){
  const el = document.getElementById("tabContent");
  const p = getWeekProgress(currentTrack, currentMonth, currentWeek);
  if(quizFinished){
    const pct = Math.round((quizScore/wk.quiz.length)*100);
    el.innerHTML = `
      <div class="quiz-card quiz-result">
        <div class="score">${quizScore}/${wk.quiz.length}</div>
        <p>${pct}% correct${p.quizBest>=pct ? ' · best: '+p.quizBest+'%' : ' · new best!'}</p>
        <button class="quiz-retry" id="quizRetry">Retry Quiz</button>
      </div>
    `;
    if(pct > p.quizBest){ p.quizBest = pct; }
    p.quizDone = true;
    saveProgress();
    document.getElementById("quizRetry").addEventListener("click", ()=>{
      quizIndex=0; quizScore=0; quizAnswered=false; quizSelected=null; quizFinished=false;
      renderQuiz(wk);
    });
    return;
  }
  const q = wk.quiz[quizIndex];
  el.innerHTML = `
    <div class="quiz-progress">Question ${quizIndex+1} of ${wk.quiz.length}</div>
    <div class="quiz-card">
      <div class="quiz-q">${q.q}</div>
      <div id="quizOpts"></div>
      ${quizAnswered ? `<div class="quiz-explain">${q.explain}</div><button class="quiz-next" id="quizNext">${quizIndex<wk.quiz.length-1?'Next Question':'See Results'}</button>` : ''}
    </div>
  `;
  const optsEl = document.getElementById("quizOpts");
  q.options.forEach((opt,i)=>{
    const b = document.createElement("button");
    b.className = "quiz-opt" + (quizAnswered ? " disabled" : "");
    if(quizAnswered){
      if(i===q.correct) b.className += " correct";
      else if(i===quizSelected) b.className += " wrong";
    }
    b.textContent = opt;
    b.addEventListener("click", ()=>{
      if(quizAnswered) return;
      quizSelected = i; quizAnswered = true;
      if(i===q.correct) quizScore++;
      renderQuiz(wk);
    });
    optsEl.appendChild(b);
  });
  if(quizAnswered){
    document.getElementById("quizNext").addEventListener("click", ()=>{
      if(quizIndex < wk.quiz.length-1){
        quizIndex++; quizAnswered=false; quizSelected=null;
        renderQuiz(wk);
      } else {
        quizFinished = true;
        renderQuiz(wk);
      }
    });
  }
}
/* ---------- Interview ---------- */
function renderInterview(wk){
  const p = getWeekProgress(currentTrack, currentMonth, currentWeek);
  const el = document.getElementById("tabContent");
  let html = `<div class="empty-hint">Tap a question to see talking points. Mark it once you can answer it out loud, unprompted.</div>`;
  wk.interview.forEach((item, i)=>{
    const open = p.interview["_open"+i] || false;
    const done = !!p.interview[i];
    html += `<div class="iv-card ${open?'open':''}" data-i="${i}">
      <div class="iv-q"><span>${item.q}</span><span class="iv-check ${done?'on':''}" data-check="${i}">${done?'✓':''}</span></div>
      <div class="iv-answer">${item.a}</div>
    </div>`;
  });
  el.innerHTML = html;

  document.querySelectorAll(".iv-card").forEach(card=>{
    card.addEventListener("click", (e)=>{
      const i = parseInt(card.dataset.i);
      if(e.target.dataset.check !== undefined && e.target.dataset.check !== ""){
        p.interview[i] = !p.interview[i];
        saveProgress();
        renderInterview(wk);
        return;
      }
      p.interview["_open"+i] = !p.interview["_open"+i];
      saveProgress();
      renderInterview(wk);
    });
  });
}

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
render();
initSync();
</script>
</body>
</html>
